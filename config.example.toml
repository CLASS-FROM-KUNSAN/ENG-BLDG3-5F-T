# =====================================================================
#  Sync Note  설정 파일
# ---------------------------------------------------------------------
#  이 파일을 config.toml 로 복사한 뒤 값을 고치세요.
#    copy config.example.toml config.toml
#
#  config.toml 은 .gitignore 에 등록되어 있어 커밋되지 않습니다.
#  비밀번호/토큰은 여기 적지 말고 `python -m syncnote secrets set` 으로
#  Windows 자격증명 관리자(DPAPI)에 저장하세요.
# =====================================================================


# ---------------------------------------------------------------------
# [general] 공통 설정
# ---------------------------------------------------------------------
[general]
# 모든 산출물(녹화·eClass 수집물·로그·상태 파일)이 저장되는 최상위 폴더.
# 비워두면 %LOCALAPPDATA%\sync-note 를 씁니다. [기본]
#   (LOCALAPPDATA 가 없으면 XDG_DATA_HOME\sync-note, 그것도 없으면 홈\.sync-note)
# %USERPROFILE% 같은 환경변수와 ~ 는 풀어서 씁니다. 로그는 그 아래 logs 폴더에 쌓입니다.
# 장소를 옮겨 다니며 쓸 때는 OneDrive/드롭박스 폴더를 피하세요(동기화 충돌).
data_dir = ""

# 로그 수준. 고를 수 있는 값(대소문자 무관):
#   DEBUG   : 가장 자세히(문제 추적용)
#   INFO    : 보통 진행 상황까지 [기본]
#   WARNING : 경고와 오류만
#   ERROR   : 오류만
#   CRITICAL: 치명적 오류만
# 설정 검사는 이 값을 보지 않으며, 모르는 값은 INFO 로 처리됩니다.
# 명령줄에서 --log-level 을 주면 그 값이 이 설정보다 우선합니다.
log_level = "INFO"

# 로그 파일 보관 일수(일). 기본 30.
#   로그는 자정마다 새 파일로 넘어가고, 지난 파일을 이 개수만큼 남긴 뒤
#   오래된 것부터 지웁니다. 1 보다 작은 값(0·음수)은 1 로 칩니다.
log_retention_days = 30

# 기기(작업) 이름. 여러 PC에서 같은 레포로 올릴 때 구분자로 쓰입니다.
#   업로드 에셋 이름 앞에 붙어 두 PC 가 서로의 파일을 덮어쓰지 않게 하고, 송출 세션·
#   eClass INDEX 파일 이름에도 들어갑니다. 에셋 이름에는 영문·숫자·._- 만 남아,
#   한글 라벨은 녹화·전사 업로드에서 지워집니다(eClass 는 해시로 바뀜). 영문을 권합니다.
# 비워두면 컴퓨터 이름을 씁니다(못 읽으면 unknown-pc). [기본]
#   예: "lab401", "notebook"
machine_label = ""


# ---------------------------------------------------------------------
# [github] 릴리스 업로드
# ---------------------------------------------------------------------
[github]
# GitHub 릴리스 업로드 스위치.
# 녹화 세그먼트(record 의 --no-upload 로 끔)·remux(--upload 때만)·수동 upload·홈 백업은
# 이 값을 보지 않습니다.
# 켜져 있으면 owner·repo 가 비어 있을 때 설정 검사가 막습니다.
#   true  = 켬 — eClass 수집물과 전사 결과를 GitHub 릴리스에 올립니다   [기본]
#   false = 끔 — eClass 수집물과 전사 결과를 올리지 않고 PC 에만 둡니다
enabled = true

# 산출물을 올릴 저장소 github.com/<owner>/<repo>. 소스코드 저장소와 달라도 됩니다.
#   owner: 계정 또는 조직 이름. course_repos 에 owner 를 안 적은 과목도 이 값을 씁니다.
#   repo : 기본 레포 이름. course_repos 가 비어 있으면 모든 업로드가 여기로 가고,
#          course_repos 를 적어도 홈 백업은 여기로 갑니다.
#   송출 알림 이슈([stream] 쪽)에 저장소를 따로 안 적으면 이 둘을 씁니다.
#   github.enabled 가 true 인데 둘 중 하나라도 비면 설정 검사에서 막힙니다.
owner = "seongbin45"
repo  = "gym-w-hall-2f"

# 릴리스는 전부 일 단위입니다: <접두사>-년-월-일
#   녹화·전사  -> recordings-2026-11-21
#   e-class    -> eclass-2026-11-21
# 그날 올린 것만 그날 릴리스에 들어갑니다(같은 파일은 업로드 기록으로 걸러짐).

# 태그 앞에 붙는 접두사. 종류별로 릴리스를 나누고 싶을 때 바꾸세요.
#   tag_prefix_eclass   : eClass 수집물 릴리스
#   tag_prefix_recording: 녹화·전사 결과·remux 업로드, 그리고 수동 upload 에서
#                         --tag 를 안 줬을 때
# 비우면 접두사 없이 날짜만 태그가 됩니다(예: 2026-11-21).
tag_prefix_eclass    = "eclass"
tag_prefix_recording = "recordings"

# 릴리스를 draft(초안)/prerelease(시험판)로 만들지 여부. 둘 다 같은 규칙입니다.
# 이미 있는 릴리스(같은 날 태그)에 올릴 때는 바꾸지 않습니다.
#   true  = 켬 — 새로 만드는 릴리스를 초안(draft)으로 만듭니다
#   false = 끔 — 새로 만드는 릴리스를 보통 릴리스로 만듭니다   [기본]
draft      = false
# 새 릴리스에 시험판(prerelease) 표시를 붙일지.
#   true  = 켬 — 새로 만드는 릴리스에 시험판(prerelease) 표시를 붙입니다
#   false = 끔 — 새로 만드는 릴리스에 시험판 표시를 붙이지 않습니다   [기본]
prerelease = false

# 큰 파일을 나눌 조각 크기(MiB). 기본 1900.
# GitHub 릴리스 에셋 1개당 상한은 2GiB 입니다.
# 이보다 큰 파일은 자동으로 .part001 .part002 ... 로 쪼개 올리고
# 복원용 manifest(.parts.json)와 합치기 스크립트를 같이 올립니다.
# 안전 마진을 둬서 기본값은 1900 MiB.
# 0 보다 커야 하고, 2000 을 넘으면 설정 검사에서 막힙니다.
split_size_mb = 1900

# 업로드 재시도. 네트워크 오류와 GitHub 5xx 응답일 때만 다시 시도합니다.
#   retry_count  : 첫 시도 뒤 다시 시도할 횟수(회). 기본 4. 0 = 재시도 안 함
#   retry_backoff: 기다리는 시간의 밑(초). n번째 재시도 전에 이 값의 n제곱초를 기다립니다.
#                  기본 2.0 이면 2 -> 4 -> 8 -> 16초.
retry_count    = 4
retry_backoff  = 2.0   # 초. 2 -> 4 -> 8 -> 16

# 업로드 성공 후 로컬 원본을 지울지 여부.
# 지금은 녹화 세그먼트에만 적용됩니다(eClass·전사·remux 업로드는 지우지 않음).
# 처음에는 반드시 false 로 두고, 신뢰가 생긴 뒤에 true 로 바꾸세요.
#   true  = 켬 — 녹화 세그먼트를 올린 직후 PC 에서 지웁니다
#   false = 끔 — 녹화 세그먼트를 올린 뒤에도 PC 에 남겨 둡니다   [기본]
delete_local_after_upload = false
# 레포는 학기마다 새로 만듭니다(repo 이름에 학기를 넣으세요).
# 지금은 eClass 업로드 때만 확인합니다. 만들 때 README 로 초기화합니다(릴리스 태그용).
# 만들려면 개인 계정은 토큰의 repo 권한, 조직은 그 조직의 레포 생성 허용이 필요합니다.
#   true  = 켬 — 올릴 레포가 없으면 새로 만듭니다
#   false = 끔 — 올릴 레포가 없으면 만들지 않고 해야 할 일을 알려 줍니다   [기본]
create_missing_repos = false
# create_missing_repos 로 레포를 새로 만들 때의 공개 범위.
# 이미 있는 레포의 공개 범위는 바꾸지 않습니다.
#   true  = 켬 — 새 레포를 비공개(private)로 만듭니다   [기본]
#   false = 끔 — 새 레포를 공개(public)로 만듭니다
repo_private = true


# =====================================================================
#  1. ECLASS 수집
# =====================================================================
[eclass]
# eClass 수집 스위치.
#   (eclass probe 는 이 값과 상관없이 돕니다)
# 켜져 있으면 login_url·username 이 비어 있을 때 설정 검사가 막습니다.
#   true  = 켬 — eclass sync 가 eClass 자료를 수집합니다   [기본]
#   false = 끔 — eclass sync 가 아무것도 수집하지 않고 끝납니다
enabled = true

# 로그인 페이지 주소. probe 로 확인한 실제 주소를 넣으세요.
#   base_url : 모든 eClass 주소(로그인 /Main.do 포함)를 이 값으로 만듭니다.
#   login_url: 지금은 enabled 가 true 일 때 비어 있지 않은지만 검사하고,
#              실제 접속에는 쓰이지 않습니다.
#   base_url 을 비우면 주소를 만들 수 없어 수집이 실패합니다.
base_url  = "https://eclass.kunsan.ac.kr"
login_url = "https://eclass.kunsan.ac.kr/"

# 학번(아이디). 비밀번호는 여기 적지 마세요.
#   python -m syncnote secrets set eclass
# enabled 가 true 인데 비어 있으면 설정 검사에서 막힙니다.
username = ""

# 브라우저 표시 여부. 처음 설정할 때는 false 로 두고 눈으로 확인하세요.
# 명령줄 --no-headless 를 주면 이 값과 상관없이 창을 띄웁니다.
#   true  = 켬 — 브라우저 창을 띄우지 않고 뒤에서 수집합니다   [기본]
#   false = 끔 — 브라우저 창을 화면에 띄워 수집 과정을 보여 줍니다
headless = true

# 페이지 로딩 대기 상한(밀리초). 학교망이 느릴 때 늘리세요.
#   페이지 이동·클릭 대기·파일 다운로드 대기 모두에 같은 상한을 씁니다. 기본 30000(30초).
timeout_ms = 30000

# 요청 간 최소 간격(초). 서버에 부담을 주지 않기 위한 값입니다.
#   페이지를 옮길 때마다 먼저 이만큼 쉽니다. 기본 1.0.
# 0.5 미만으로 내리지 마세요.
#   0 보다 크고 0.5 보다 작으면 설정 검사에서 막힙니다(음수도 막힘).
#   0 은 검사를 통과하고 쉬지 않습니다(권장하지 않음).
request_delay_sec = 1.0

# 수집할 과목.
#   - 비워두면([]) 내 수강 목록 전체를 자동으로 돌립니다. [기본]
#   - 특정 과목만 원하면 과목명 일부나 과목코드를 넣으세요. 예: ["자료구조", "2026211043701"]
#   - 대소문자 무관 부분 일치로 찾고, 안 걸리면 띄어쓰기·글자 순서를 무시한
#     비슷한 이름 하나를 고릅니다. 그래도 못 찾은 항목이 있으면 전 과목을 수집합니다.
#   - 환경변수 SYNCNOTE_ECLASS_COURSES 가 있으면 이 값 대신 그것을 씁니다.
courses = []

# 제외할 과목. 과목명 일부나 과목코드(대소문자 무관 부분 일치). 비우면 제외 없음. [기본]
#   courses 가 비어 있든 아니든 항상 마지막에 적용됩니다.
exclude_courses = []
# 읽을 쪽지함. RECEIVE(받은) / SEND(보낸) / WASTEBASKET(휴지통)
#   여러 개를 적으면 차례로 모두 읽습니다. 기본 ["RECEIVE"]. 대소문자 무관.
#   비우면([]) 쪽지를 읽지 않습니다. [eclass.menus] 의 message 가 false 여도 안 읽습니다.
#   그 밖의 값은 그 쪽지함만 오류로 기록하고 건너뜁니다.
message_boxes = ["RECEIVE"]

# 텍스트(.md) 옆에 같은 이름의 화면 스크린샷(.png)을 남깁니다.
#   표 모양, 색으로 강조한 마감일, 본문 그림처럼 글자로 옮기면 사라지는
#   것을 남겨 둡니다. 추출이 무언가를 빠뜨렸을 때 알아챌 수도 있습니다.
#   - 모든 화면 머리의 본인 '학번(이름)님' 은 가려서 찍습니다.
#   - 쪽지는 보낸이를 .md 와 같은 이름표(보낸이-xxxxxx)로 바꾼 뒤 찍고,
#     다 바꾸지 못하면 찍지 않습니다.
#   - 내용이 그대로라 .md 를 다시 쓰지 않는 실행에서는 찍지 않습니다.
#   용량이 늘어납니다(화면 한 장에 수백 KB). 끄려면 false.
#   true  = 켬 — 글(.md)을 저장할 때마다 화면 사진(.png)도 함께 저장합니다   [기본]
#   false = 끔 — 화면 사진은 저장하지 않습니다(.md 는 그대로 저장)
screenshots = true
# 텍스트(.md) 옆에 '한 파일짜리' 전체 HTML(.html)도 남깁니다(SingleFile 방식).
#   렌더된 DOM + 이미지/CSS/폰트를 data URI 로 인라인해 오프라인에서도 같은
#   모습. 스크립트는 제거(정적 스냅샷). 개인정보(이름/학번/이메일/전화)는
#   마스킹합니다. 과제/첨부 '파일 다운로드' 는 이와 별개로 그대로 동작합니다.
#   용량이 더 늘 수 있습니다(이미지 많은 페이지). 끄려면 false.
#   true  = 켬 — 글(.md)을 저장할 때마다 페이지 원본(.html)도 함께 저장합니다   [기본]
#   false = 끔 — 페이지 원본(.html)은 저장하지 않습니다
capture_html = true

# ---------------------------------------------------------------------
# 과목 = 레포지터리
#   이 PC 가 담당하는 과목과 그 과목이 올라갈 레포를 적습니다.
#   비워 두면 예전처럼 github.owner / github.repo 한 곳으로 전부
#   올라갑니다. 한 줄이라도 적는 순간, 여기 없는 과목은 수집은 하되
#   올리지 않습니다(로컬에만 남습니다).
#
#   두 겹 대괄호 [[...]] 입니다. 한 겹으로 적으면 목록이 아니라
#   표 하나가 되어 업로드·녹화 때 오류가 납니다.
#
#   위쪽 eclass.courses 와 헷갈리지 마세요.
#     eclass.courses       = 무엇을 수집할지 (이름 일부로 거르기)
#     eclass.course_repos  = 어디로 올릴지   (과목 -> 레포)
# ---------------------------------------------------------------------
# 비우면 github.owner / github.repo 한 곳으로 전부 올라갑니다. [기본]
# 항목마다 name(필수)·repo(필수)·id(선택)·owner(선택, 생략하면 github.owner).
#   과목 코드나 owner/repo 가 두 항목에서 겹치면 업로드·녹화 때 오류로 멈춥니다
#   (설정 검사는 통과). name·repo 가 비었거나 repo 에 쓸 수 없는 글자가 있어도 같습니다.
#   과목 폴더명이 name 을 포함하면 맞습니다(예: '자료구조_01' 폴더는 '자료구조').
course_repos = []

# 아래처럼 적으면 과목마다 다른 레포로 갑니다(주석을 푸세요).
# [[eclass.course_repos]]
# id   = "2026211043701"          # eClass 과목 코드(있으면 가장 정확)
# name = "자료구조"                # 폴더명·시간표와 맞추는 이름
# repo = "datastructure-2026-2"   # 이 과목이 올라갈 레포
# # owner = "다른조직"             # 생략하면 github.owner

# [[eclass.course_repos]]
# id   = "2026211043802"
# name = "운영체제"
# repo = "os-2026-2"



# ---------------------------------------------------------------------
# [eclass.menus] 메뉴별 수집 on/off
#   Eclass 과목 좌측 메뉴 기준입니다. 과목마다 있는 메뉴가 다르므로
#   없는 메뉴는 자동으로 건너뜁니다.
#   모든 키 공통: true = 켬 — 그 메뉴를 수집합니다. false = 끔 — 건너뜁니다.
# ---------------------------------------------------------------------
[eclass.menus]
# --- 학습 목차 ---
curriculum     = true    # 학습 목차(주차별). 세 주차씩 보여 주는 화면을
                         #   좌우로 끝까지 넘겨 전 주차를 모읍니다.
                         #   true  = 켬 — '학습 목차' 메뉴를 수집해 '학습목차' 폴더에 저장합니다   [기본]
                         #   false = 끔 — '학습 목차' 메뉴는 수집하지 않습니다
lecture_list   = true    # 강의 목록 / 교안
                         #   true  = 켬 — '강의 목록' 메뉴를 수집해 '강의목록' 폴더에 저장합니다   [기본]
                         #   false = 끔 — '강의 목록' 메뉴는 수집하지 않습니다
# --- 과목 정보 ---
syllabus       = true    # 수업 계획서 (강의계획서)
                         #   true  = 켬 — '강의계획서' 메뉴를 수집해 '강의계획서' 폴더에 저장합니다   [기본]
                         #   false = 끔 — '강의계획서' 메뉴는 수집하지 않습니다
course_info    = true    # 과목 정보
                         #   true  = 켬 — '과목 정보' 메뉴를 수집해 '과목정보' 폴더에 저장합니다   [기본]
                         #   false = 끔 — '과목 정보' 메뉴는 수집하지 않습니다
# --- 학습 정보 ---
notice         = true    # 공지사항  (본문 + 첨부)
                         #   true  = 켬 — '공지사항' 메뉴를 수집해 '공지사항' 폴더에 저장합니다   [기본]
                         #   false = 끔 — '공지사항' 메뉴는 수집하지 않습니다
qna            = true    # 질의응답
                         #   true  = 켬 — '질의응답' 메뉴를 수집해 '질의응답' 폴더에 저장합니다   [기본]
                         #   false = 끔 — '질의응답' 메뉴는 수집하지 않습니다
materials      = true    # 강의자료실 / 학습자료실 (첨부파일)
                         #   true  = 켬 — '강의자료실' 메뉴를 수집해 '강의자료실' 폴더에 저장합니다   [기본]
                         #   false = 끔 — '강의자료실' 메뉴는 수집하지 않습니다
# --- 학습 활동 ---
assignment     = true    # 과제 명세 + 첨부. 제출물은 건드리지 않습니다.
                         #   true  = 켬 — '과제' 메뉴를 수집해 '과제' 폴더에 저장합니다   [기본]
                         #   false = 끔 — '과제' 메뉴는 수집하지 않습니다
attendance     = false   # 출석. 읽기 전용이지만 민감정보라 기본 off.
                         #   켜도 upload.exclude_menus 에 있으면 올리지 않습니다.
                         #   true  = 켬 — '출석' 메뉴를 수집해 '출석' 폴더에 저장합니다
                         #   false = 끔 — '출석' 메뉴는 수집하지 않습니다   [기본]
team           = false   # 팀활동
                         #   true  = 켬 — '팀활동' 메뉴를 수집해 '팀활동' 폴더에 저장합니다
                         #   false = 끔 — '팀활동' 메뉴는 수집하지 않습니다   [기본]
# --- 학습 현황 ---
progress       = false   # 학습 현황(진도율). 민감정보라 기본 off.
                         #   켜도 upload.exclude_menus 에 있으면 올리지 않습니다.
                         #   true  = 켬 — '학습현황' 메뉴를 수집해 '학습현황' 폴더에 저장합니다
                         #   false = 끔 — '학습현황' 메뉴는 수집하지 않습니다   [기본]
# --- 쪽지 ---
#   강의자료가 쪽지로도 옵니다. 보낸이 이름/사번은 익명화해 저장하고
#   본문은 그대로 둡니다. 과목이 아니라 계정 단위라 한 번만 돕니다.
#   true  = 켬 — message_boxes 에 적은 쪽지함의 쪽지를 수집합니다   [기본]
#   false = 끔 — 쪽지는 수집하지 않습니다
message        = true
# 계정 레벨 메뉴(학습시간표·수강과목·학습도우미 공지/질의응답/행사안내/FAQ·
# 커뮤니티·공개강좌). 과목이 아니라 계정에 딸린 메뉴라 한 번만 수집합니다.
# 개인정보(학번/이메일/전화/이름)는 마스킹합니다(쪽지와 같은 익명화 수준).
# 민감하면 아래 exclude_menus 에 "account" 대신 폴더명 "계정정보" 를 넣어 업로드 제외.
#   true  = 켬 — 계정 메뉴 내용을 '계정정보.md' 로 모아 저장합니다   [기본]
#   false = 끔 — 계정 메뉴는 수집하지 않습니다
account        = true
# --- 성적 ---
grade          = false   # 성적보기. 민감정보라 기본 off.
                         #   켜도 upload.exclude_menus 에 있으면 올리지 않습니다.
                         #   true  = 켬 — '성적' 메뉴를 수집해 '성적' 폴더에 저장합니다
                         #   false = 끔 — '성적' 메뉴는 수집하지 않습니다   [기본]

# ---------------------------------------------------------------------
#  !! 위험 구역 !!
#  시험 / 설문 / 토론은 "열람" 자체가 LMS에 기록으로 남습니다.
#    - 시험 페이지 진입 = 응시 시작으로 기록될 수 있음
#    - 설문 진입 = 참여로 집계될 수 있음
#    - 토론 조회 기록이 참여 점수에 반영되는 과목이 있음
#  자동화된 접근은 부정행위로 오해받을 수 있습니다.
#  아래를 켜더라도 "목록 제목만" 읽고 상세 페이지에는 절대 진입하지
#  않습니다. 그래도 책임은 사용자에게 있습니다.
# ---------------------------------------------------------------------
[eclass.risky]
# 이 값이 true 가 아니면 아래 3개는 무시됩니다.
#   true  = 켬 — 아래 시험·설문·토론 가운데 켠 메뉴의 목록 제목을 읽습니다
#   false = 끔 — 시험·설문·토론 메뉴는 하나도 열지 않습니다   [기본]
i_understand_the_risk = false

exam       = false   # 시험
                     #   true  = 켬 — 위 동의를 켰을 때 시험 목록 제목을 읽어 '시험' 폴더에 저장합니다
                     #   false = 끔 — 시험 메뉴는 열지 않습니다   [기본]
survey     = false   # 설문
                     #   true  = 켬 — 위 동의를 켰을 때 설문 목록 제목을 읽어 '설문' 폴더에 저장합니다
                     #   false = 끔 — 설문 메뉴는 열지 않습니다   [기본]
discussion = false   # 토론
                     #   true  = 켬 — 위 동의를 켰을 때 토론 목록 제목을 읽어 '토론' 폴더에 저장합니다
                     #   false = 끔 — 토론 메뉴는 열지 않습니다   [기본]


# ---------------------------------------------------------------------
# [eclass.upload] 무엇을 릴리스에 올릴지
#   수집은 하되 업로드는 안 할 수 있습니다(민감정보).
# ---------------------------------------------------------------------
[eclass.upload]
# eClass 수집물 업로드 스위치.
# 올리려면 github.enabled 도 켜져 있어야 하고, 명령에 --no-upload 가 없어야 합니다.
#   true  = 켬 — 수집이 끝나면 이번 학기 폴더를 GitHub 릴리스에 올립니다   [기본]
#   false = 끔 — 수집만 하고 올리지 않습니다(PC 에만 남음)
enabled = true
# 안전장치: 대상 저장소가 public 이면 올리지 않습니다. eClass 자료에는
# 동급생 이름·전체 화면(.png)·첨부 파일명 등 개인정보가 섞일 수 있어서,
# 공개 저장소로 나가는 것을 기본 차단합니다(저장소를 private 로 두세요).
# 저장소 가시성을 못 읽으면(네트워크 실패 등) 막지 않습니다.
# 정말 공개하려면 아래를 false 로 끄세요(권장하지 않음).
#   true  = 켬 — 저장소가 공개(public)면 그 과목은 올리지 않고 실패로 기록합니다   [기본]
#   false = 끔 — 저장소가 공개인지 확인하지 않고 올립니다
block_public = true
# 업로드에서 제외할 메뉴 (위 [eclass.menus] 키 이름 사용)
#   키 이름은 폴더명(예: grade -> 성적)으로 바꿔, 경로에 그 폴더가 든 파일을 뺍니다.
#   키 목록에 없는 값은 폴더명 그대로 씁니다(예: "계정정보").
#   기본 ["grade", "attendance", "progress"]. 비우면([]) 메뉴로는 빼지 않습니다.
#   민감 메뉴(grade/attendance/progress)를 켰는데 이 목록에 없으면 실행 때 경고합니다.
exclude_menus = ["grade", "attendance", "progress"]
# 확장자 화이트리스트. 비우면 전부 허용. [기본]
#   예: ["pdf", "md", "png"] (점·대소문자 무관). 적으면 목록에 없는 확장자는
#   .md/.png/.html 도 포함해 전부 올리지 않습니다(로컬에는 남음).
allow_extensions = []
# 이 용량(MB)을 넘는 첨부는 올리지 않고 로컬에만 둡니다. 0 = 제한 없음 [기본]
#   단위 MiB. 첨부뿐 아니라 업로드 대상 파일 전부에 적용됩니다.
#   정수로 적으세요(소수는 버림). 음수는 검사되지 않고 모든 파일이 빠집니다.
max_file_mb = 0


# ---------------------------------------------------------------------
# [eclass.menu_ids]
#   eClass 좌측 메뉴는 내부적으로 menu_00092 같은 고정 ID 를 씁니다.
#   이 값들은 소스코드(src/syncnote/eclass/urls.py)에 이미 들어 있으므로
#   보통은 비워 두면 됩니다.
#
#   학교가 LMS 를 개편해 수집이 안 될 때만 채우세요. 새 ID 는
#     scripts\eclass_probe.bat
#   을 돌리면 나오는 report.json 에서 확인할 수 있습니다.
#
#   예:  assignment = "menu_00063"
#
#   적을 수 있는 키: curriculum, lecture_list, syllabus, course_info, attendance,
#   assignment, team, progress, grade, exam, survey, discussion.
#   notice/qna/materials 는 게시판 주소를 따로 만들어 이 값을 쓰지 않습니다.
#   값은 그 메뉴의 menuId 만 바꿉니다(상위 메뉴 ID 는 그대로). 비우면 기본 ID.
# ---------------------------------------------------------------------
[eclass.menu_ids]
# curriculum   = ""
# lecture_list = ""
# attendance   = ""
# assignment   = ""
# team         = ""


# =====================================================================
#  2. 화면 녹화 + 음성 녹음
# =====================================================================
[recording]
enabled = true   # 녹화 기능 전체 스위치.
                 # 켜져 있을 때 monitors 목록 형식(정수·중복)도 검사합니다.
                 # 주의: record start/schedule/watch 명령 자체를 막지는 않습니다(검사에만 씀).
                 # (이 줄은 [recording] 바로 아래에 둡니다 — Actions 가 이 줄을 찾아 끕니다)
                 #   true  = 켬 — 설정 검사가 녹화에 필요한 것(numpy·ffmpeg·장치 설정)을 확인합니다   [기본]
                 #   false = 끔 — 설정 검사가 녹화 관련 항목을 확인하지 않습니다

# 녹화 파일 컨테이너. 고를 수 있는 값은 둘뿐입니다.
#   "mkv" = 녹화 중 전원이 꺼져도 앞부분이 살아남습니다.  [기본, 권장]
#   "mp4" = 정상 종료되지 않으면 파일이 깨집니다(설정 검사가 경고를 띄움).
# 그 밖의 값은 설정 오류입니다.
container = "mkv"

# 녹화를 이 길이(분)마다 끊어서 별도 파일(세그먼트)로 만듭니다. 단위: 분, 0 이상.
#   - 2GiB 릴리스 상한을 자연스럽게 피합니다
#   - 중간에 뻗어도 앞부분은 살아남습니다
#   - 0 = 끊지 않음 — 녹화 전체가 한 파일(설정 검사가 경고). 권장하지 않음
# max_duration_minutes 보다 크면 그 값으로 줄여 씁니다.
segment_minutes = 30

# 최대 녹화 길이(분). 깜빡 잊고 켜둔 채 퇴근하는 사고 방지. 단위: 분, 0보다 커야 함.
# 수동 녹화(record start)에서 --minutes 를 안 주면 이 길이에서 멈추고,
# 감지 녹화(record watch)는 녹화 하나를 이 길이에서 끊고, 대상이 아직 떠 있으면 곧바로 다음
# 녹화를 이어서 시작합니다(수업을 놓치지 않게).
# 시간표 녹화(record schedule)는 수업 길이(+여유 시간)만큼 녹화하므로 이 값을 쓰지 않습니다.
max_duration_minutes = 240

# 녹화 시작 전 여유 시간(분). 시간표 기반 자동 녹화(record schedule)에만 적용.
# 0 = 여유 없이 수업 시작 시각에 녹음 시작.
#
# pre_roll 은 **소리에만** 적용됩니다. 화면 캡처는 당기지 않고 정시에
# 시작합니다. 그 2분 동안 강의실 PC 앞에 앉은 사람(조교, 먼저 온 학생)의
# 화면이 통째로 찍혀 릴리스에 올라가기 때문입니다. 화면은 그 2분을
# 놓쳐도 잃는 것이 거의 없습니다 — 띄워 둔 슬라이드는 정시에도
# 그대로 있습니다. 반면 소리는 수업이 1분 일찍 시작하면 그 말을
# 영영 못 받습니다. 그래서 소리만 당깁니다.
#
# 주의: 소리는 pre_roll 동안 실제로 녹음됩니다. 수업 전 강의실 대화가
# 들어갑니다. 그게 곤란하면 0 으로 두세요 — 대신 수업이 예정보다
# 일찍 시작하면 그 앞부분을 놓칩니다. 어느 쪽을 택할지는 운영자가
# 정할 문제라, 조용히 0 으로 바꾸지 않았습니다.
#
# 수동 녹화(record start)와 watch 에는 적용되지 않습니다. "지금부터"
# 를 누른 것이지 "2분 전부터" 가 아니기 때문입니다.
pre_roll_minutes  = 2
# 수업 끝난 뒤 더 녹화할 여유 시간(분). 시간표 기반 자동 녹화에만 적용(소리·화면 모두).
# 0 = 수업 끝 시각에 바로 멈춤. 수동 녹화와 watch 에는 적용되지 않습니다.
post_roll_minutes = 3

# 시간이 겹치는 수업. 녹화는 한 번에 하나뿐이라 겹치는 구간을 어디에 줄지 정합니다.
#   "merge" = 앞 수업 시작부터 뒤 수업 끝까지 한 번에 쭉(원테이크). 잃는 시간 없음.
#             파일 이름에 두 수업, 각 수업의 시작·끝은 파일 안 메타데이터(태그·챕터)에. [기본]
#   "first" = 앞 수업을 끝까지, 뒤 수업은 그 뒤부터
#             (뒤 수업 앞부분을 잃음. 뒤 수업이 앞 수업 안에 통째로 들어가면 전부 잃음)
#   "last"  = 뒤 수업이 시작하면 넘김. 뒤 수업이 앞 수업 안에 들어가면 끝난 뒤
#             앞 수업을 이어서 녹화 (앞 수업 일부를 잃음)
# 이 세 값 말고는 설정 오류입니다.
# 여유 시간(pre/post roll)끼리만 겹치면 어느 값이든 두 수업 사이 한가운데서 나눠
# 수업 시간은 잃지 않습니다. 시간표 편집기가 잃는 구간을 미리 알려 줍니다.
overlap = "merge"

# ---------------------------------------------------------------------
[recording.video]
# 화면 녹화.
# ffmpeg 가 없으면(소리 녹음이 켜져 있을 때) 화면은 건너뛰고 소리만 받습니다
# (ffmpeg 를 깐 뒤 record remux 로 파일을 만듦).
#   true  = 켬 — 화면과 소리를 함께 녹화합니다   [기본]
#   false = 끔 — 화면은 녹화하지 않고 소리만 녹음합니다
enabled = true

# 어느 화면을 잡을지. 정수.
#   0 = 전체 바탕화면(기본). 모니터가 둘이면 둘을 가로로 이어 붙인
#       그림이 나옵니다 — 빔프로젝터 쪽이 절반 크기로 줄고, 교탁
#       화면에 떠 있는 메일까지 같이 올라갑니다.
#       (backend = "ddagrab" 이면 0 은 주 모니터 하나만 잡습니다.)
#   1,2,... = 그 화면만. 번호는 `python -m syncnote devices` 로 확인.
#
# window_title 을 적어 두면 이 값은 무시됩니다(창 하나가 화면 하나보다
# 좁으니 더 좁은 쪽이 이깁니다). monitors 목록이 비어 있지 않으면 그쪽을 씁니다.
# 번호가 화면 개수보다 크면 경고를 찍고 전체 바탕화면으로 돌아갑니다 —
# 조용히 1번으로 떨어지면 설정이 틀린 줄 모르고 한 학기를 보냅니다.
monitor = 0

# 모니터가 두 개일 때 각각 독립 파일로 녹화합니다. 1 이상의 정수 목록, 중복 불가.
#   monitors = [1, 2]  ->  <stem>_mon1.mkv, <stem>_mon2.mkv
#   비워두면([]) 위 monitor 단수 설정을 그대로 씁니다.
#   번호가 하나뿐이면(예: [2]) 파일 이름에 _mon 꼬리를 붙이지 않습니다.
#   번호는 `python -m syncnote devices` 로 확인하세요.
monitors = []

# 캡처 방식 (Windows). 고를 수 있는 값은 둘뿐이고, 그 밖의 값은 설정 오류입니다.
#   "gdigrab"  : 호환성 최고, CPU 사용 보통. 화면을 좌표로 잘라내 번호가 정확합니다.
#                [기본, 저사양 권장]
#   "ddagrab"  : Desktop Duplication. 빠르지만 ffmpeg 빌드와 GPU 를 탑니다.
#                창 단위 캡처(window_title)를 못 하고, 마우스 표시(draw_mouse)를 안 받으며,
#                monitor 번호가 다른 화면을 가리킬 수 있습니다(그래픽 드라이버 순서).
backend = "gdigrab"

# 프레임레이트(초당 프레임 수). 0보다 커야 합니다. 강의 슬라이드는 5~10 이면 충분합니다.
# 저사양 노트북에서 실시간 전사를 함께 켠다면 5 를 쓰세요(설정 검사가 5 이하를 권함).
# 키프레임은 4초마다(fps×4 프레임) 넣습니다.
fps = 10

# 해상도 축소(픽셀). 0 이면 원본 그대로.
# 1920x1080 화면을 1280x720 으로 줄이면 용량과 CPU가 크게 줄어듭니다.
# 가로·세로 중 한쪽만 0 이면 그쪽은 비율에 맞춰 자동으로 정합니다(짝수로 맞춤).
# 둘 다 0 이면 축소하지 않습니다.
scale_width  = 1280
# 세로 픽셀. 0 = 가로에 맞춰 비율 유지.
scale_height = 0        # 0 = 비율 유지

# x264 설정. preset 은 libx264 의 -preset 에 그대로 들어갑니다.
# 빠른 쪽일수록 CPU 를 덜 쓰고 파일이 커집니다(코드는 값을 검사하지 않음).
preset = "veryfast"      # ultrafast > superfast > veryfast > faster > fast
# crf 는 libx264 의 -crf 에 그대로 들어갑니다. 클수록 용량이 작고 화질이 낮습니다.
#   슬라이드 위주 강의: crf 30 전후도 충분히 읽힙니다.
crf    = 30

# 특정 창만 녹화하려면 창 제목을 넣으세요(gdigrab 의 title= 로 잡음).
# 비우면 monitor / monitors 설정대로 화면을 잡습니다.
# ddagrab 백엔드는 창 캡처를 못 해 경고만 찍고 이 값을 무시합니다.
# 예: "Zoom 회의"
window_title = ""

# 마우스 커서 표시 (gdigrab 에만 적용).
#   true  = 켬 — 녹화 화면에 마우스 커서가 보입니다   [기본]
#   false = 끔 — 녹화 화면에 마우스 커서가 보이지 않습니다
draw_mouse = true

# ---------------------------------------------------------------------
[recording.audio]
# 소리 녹음.
# 켜져 있으면 doctor 가 soundcard 패키지와 오디오 장치를 점검합니다.
# 끄면 실시간 전사(transcribe.realtime)는 켤 수 없습니다(설정 오류).
#   true  = 켬 — 소리를 녹음해 녹화 파일에 넣습니다   [기본]
#   false = 끔 — 소리 없이 화면만 녹화합니다
enabled = true

# 마이크를 여는 방법. 허용 값은 아래 둘이고, 그 밖의 값은 설정 오류입니다.
# 시스템 소리(스피커로 나가는 소리)는 어느 값이든 soundcard(WASAPI 루프백)로 받습니다.
#   "soundcard" : WASAPI 로 직접 엽니다. 드라이버 설치 불필요.  [기본, 권장]
#   "dshow"     : 마이크를 처음부터 ffmpeg DirectShow 로 엽니다(ffmpeg 필요).
#                 soundcard 로는 잘 안 되는 마이크가 있을 때 고정하는 용도입니다.
# 어느 값이든 마이크는 사슬로 엽니다: soundcard → ffmpeg → SoX → arecord(리눅스).
# 앞 방법이 안 열리면(장치 형식을 못 받음 — 메인보드 마이크 단자에서 흔함, 다른 앱이 독점,
# 도구 고장) 다음 방법으로 엽니다. 녹음 중 끊기면(장치 뽑힘·프로세스 종료) 다음 방법으로
# 이어 받고, 끊긴 시간은 무음으로 채워 화면과 소리가 어긋나지 않게 합니다. 전부 안 되면
# 무음으로 시간을 채우며 2·5·10·30초 간격으로 다시 엽니다(다시 꽂으면 그때부터 녹음).
backend = "soundcard"

# 샘플레이트(Hz). system·mic 트랙, 마이크 시험, 실시간 전사가 모두 이 값으로 받습니다.
samplerate = 48000
# 채널 수. 2 = 스테레오, 1 = 모노.
channels   = 2

# --- 트랙 1: 시스템 소리 (스피커로 나가는 소리 = 온라인 강의 소리) ---
# 시스템 소리 트랙.
# 마이크까지 끄면 설정 오류입니다.
#   true  = 켬 — 스피커로 나가는 소리를 녹음합니다   [기본]
#   false = 끔 — 스피커로 나가는 소리는 녹음하지 않습니다
system_enabled = true
# 비우면 현재 기본 재생 장치를 자동으로 씁니다.
# 이름 일부만 적어도 됩니다(대소문자 무시, 루프백 장치나 스피커 이름에서 찾음).
# 못 찾으면 그 트랙은 열리지 않고 오류 로그가 남습니다.
# 특정 장치를 고르려면 `python -m syncnote devices` 로 이름을 확인하세요.
system_device = ""
# 시스템 소리 증폭(dB). 0.0 = 그대로, 양수 = 크게, 음수 = 작게. 넘친 소리는 잘립니다.
system_gain_db = 0.0

# --- 트랙 2: 마이크 ---
# 마이크 트랙.
# 시스템 소리까지 끄면 설정 오류입니다.
#   true  = 켬 — 마이크 소리를 별도 트랙으로 녹음합니다   [기본]
#   false = 끔 — 마이크 소리는 녹음하지 않습니다
mic_enabled = true
# 비우면 기본 마이크(또는 mic_auto_select 가 고른 살아 있는 마이크)를 씁니다.
# 이름 일부만 적어도 됩니다(대소문자 무시). 적으면 그 장치로 고정되고 자동 선택은 꺼집니다.
# 이름은 `python -m syncnote devices` 로 확인하세요.
mic_device  = ""

# --- 트랙 3: 스테레오 믹스(있을 때만) ---
# 메인보드 마이크 단자(3.5mm)에 꽂은 마이크가 Realtek 드라이버에서 '스테레오 믹스' 로만 보이는
# PC 가 있습니다. 스테레오 믹스는 기본 마이크로 고르지 않고, 따로 한 트랙으로 함께 녹음해
# 마이크 트랙에 겹쳐 남깁니다(둘 다 받은 소리가 함께 들림).
# 기본 녹음 장치가 스테레오 믹스이고 마이크 입력이 없으면 doctor·devices·녹화 로그가 Realtek
# 드라이버 설치·업데이트를 안내합니다(사람이 직접 해야 함).
#   true  = 켬 — 스테레오 믹스 장치가 있으면 함께 녹음합니다   [기본]
#   false = 끔 — 스테레오 믹스는 녹음하지 않습니다
stereo_mix_enabled = true
# 비우면 이름에 '스테레오 믹스'·'Stereo Mix' 가 들어간 장치. 이름 일부만 적어도 됩니다.
stereo_mix_device = ""

# 마이크 자동 증폭(마이크·스테레오 믹스 트랙). 강의실 PC 에서 수업 중 마이크가 -58 ~ -79 dBFS 로
# 녹화 영상에서 들리지 않았습니다(Windows 입력 레벨은 이미 최대). 받은 소리를 ffmpeg dynaudnorm 으로
# 짧은 구간마다 키웁니다 — 작은 소리는 많이, 큰 소리는 적게 키워 찢어지지 않게.
#   true  = 켬 — 녹화 파일을 만들 때 마이크 소리를 자동으로 키웁니다   [기본]
#   false = 끔 — 받은 그대로
mic_auto_gain = true
# 최대 몇 dB 까지 키울지. 0 이면 끔. 40 = 최대 100배.
mic_auto_gain_max_db = 40.0

# 기본 마이크가 '죽어 있으면' 다른 마이크로 바꿉니다.
#
# 2026-11-13 실기 PC 의 기본 마이크는 '마이크 배열 (Audio Share)' 라는
# 가상 장치였고, 61초 녹음에 0 아닌 바이트가 하나도 없었습니다. 설정을
# 비워 둔 PC 는 OS 기본 장치를 그대로 쓰므로 수업 내내 비트 단위 0 이
# 녹음되고, 끝나고서야 압니다.
#
# 녹화 시작 전에 마이크를 1.5초씩 열어 최대 레벨만 재고 버립니다.
# 정확히 0 이면 죽은 것으로 보고 다음 장치를 봅니다. 첫 성공에서
# 멈추므로 보통 1.5초면 끝납니다. 받은 소리는 파일로 남기지 않습니다.
# 전부 0 이면 기본 마이크로 시도하고 오류 로그를 남깁니다(대개 Windows 마이크 권한 문제).
#
# 좋은 마이크를 고르는 기능이 아닙니다. **죽은 마이크를 거르는 것까지만**
# 합니다 — 잡음 크기로는 어느 쪽이 교수 목소리를 잘 잡을지 알 수 없습니다.
#
# mic_device 에 이름을 적었으면 이 값은 무시됩니다. 사람이 고른 것을
# 코드가 뒤집지 않습니다.
# 시스템 소리(루프백)에는 적용되지 않습니다 — 재생 중인 게 없으면
# 정확히 0 이 정상이라 전부 오탐이 됩니다.
#   true  = 켬 — 녹화 전에 마이크를 시험해 신호가 전혀 없는 장치를 건너뜁니다   [기본]
#   false = 끔 — 시험하지 않고 Windows 기본 마이크를 그대로 씁니다
mic_auto_select = true
# 마이크 하나를 시험하는 시간(초). mic_auto_select 가 켜져 있을 때만 씁니다.
mic_probe_sec   = 1.5
# 마이크 증폭(dB). 0.0 = 그대로, 양수 = 크게, 음수 = 작게. 넘친 소리는 잘립니다.
mic_gain_db = 0.0

# 두 트랙을 최종 파일에 어떻게 넣을지. 허용 값은 아래 셋이고, 그 밖의 값은 설정 오류입니다.
#   "separate" : 별도 트랙 2개로 저장. 나중에 분리 가능.     [기본, 권장]
#   "mixed"    : 하나로 합침. 파일이 작지만 분리 불가.
#   "both"     : 별도 트랙 2개 + 합친 트랙 1개 (총 3트랙).
# 트랙이 하나뿐이면(system 이나 mic 하나만 켬) 어느 값이든 그 트랙 하나만 들어갑니다.
track_layout = "separate"

# 무음 경고(초). 트랙마다 따로 봅니다 — 한 트랙이 이 시간 이상 이어서 무음이면
# 그 트랙 이름으로 경고 로그를 남깁니다(세그먼트마다 한 번). 녹화는 계속됩니다.
# (장치를 잘못 골랐을 때 3시간 뒤에야 알게 되는 사고 방지)
silence_warn_sec = 60
# 켜져 있는 트랙이 **전부 동시에** 오래 무음이면 장치를 확인하라는 경고를 남깁니다.
# (마이크만 조용한 것은 흔합니다 — 판서, 시험 시간)
# **무음이어도 녹화·업로드·송출은 멈추지 않습니다.** 조용한 시간·마이크를 늦게 꽂은 수업도
# 기록은 남아야 하기 때문입니다(예전에는 여기서 녹화를 멈추고 업로드를 막았음).
#   silence_stop_sec  : 이만큼 무음이면 경고 (단위: 초, 0 = 이 경고를 끔)
#   silence_abort_sec : 이만큼 무음이면 한 번 더 경고 (초, 0 = 끔)
# 이름은 기존 config.toml 과 맞추려고 그대로 둡니다. 무음 시간은 세그먼트마다 처음부터 셉니다.
# 예약(record schedule)·감지(record watch) 녹화에만 경고합니다. 수동(record start)은 경고 없음.
silence_stop_sec  = 900
# 위 설명 참고. 단위: 초, 0 = 이 경고를 끔.
silence_abort_sec = 3600
# '완전 무음' 기준(최대 진폭, 0~1 사이 비율). 소리 크기가 이 값보다 작으면 무음입니다.
# 낮출수록 엄격합니다 — 더 작은 소리만 무음으로 칩니다.
silence_peak = 1e-5

# Silero VAD (ONNX Runtime) 기반 음성 활동 감지.
# onnxruntime 이 없거나 모델 파일이 없으면 기존 진폭(peak) 판정으로 자동 폴백합니다.
# 빔프로젝터·에어컨 소음 때문에 장치 문제(무음)를 놓치는 일을 줄이지만,
# 말소리 없이 소음만 길게 이어지면 silence_stop/abort 에 걸릴 수 있습니다.
#   true  = 켬 — 소리가 커도 말소리가 아니면 무음으로 봅니다
#   false = 끔 — 소리 크기만 보고 무음인지 판단합니다   [기본]
use_vad = false
# ONNX 모델 파일 경로 (비우면 SILERO_VAD_PATH 환경변수 또는 models/silero_vad.onnx)
# use_vad 를 켰을 때만 씁니다. 상대 경로는 실행한 폴더 기준입니다.
vad_model_path = ""

# ---------------------------------------------------------------------
# [recording.triggers] 언제 녹화를 시작할지
# ---------------------------------------------------------------------
[recording.triggers]
# (A) 수동 실행 — 바탕화면 바로가기 / 터미널 (record start)
# 꺼져 있으면 종료 코드 1 로 끝납니다.
#   true  = 켬 — record start 를 실행하면 녹화합니다   [기본]
#   false = 끔 — record start 를 실행해도 녹화하지 않고 이유를 알립니다
manual = true

# (B) 시간표 기반 자동 (record schedule — register_tasks.ps1 이 로그온 때 띄움)
# (예전 이름 schedule_enabled 는 읽지 않습니다 — 기존 파일에 false 로 남아 있어서)
# 꺼져 있어도 --show(시간표 보기)는 됩니다. 작업 스케줄러에서 실패로
# 보이지 않게 종료 코드는 0 입니다.
#   true  = 켬 — 시간표([[recording.timetable]])대로 기다렸다가 녹화합니다   [기본]
#   false = 끔 — 시간표 자동 녹화를 하지 않고 이유를 남긴 뒤 끝납니다
schedule = true

# (C) 특정 프로그램/창이 뜨면 자동 시작 (record watch — register_tasks.ps1 이 로그온 때 띄움)
# (예전 이름 watch_enabled 는 읽지 않습니다 — 기존 파일에 false 로 남아 있어서)
# 켜져 있으면 doctor 가 psutil 패키지를 필수로 봅니다. 꺼져 있으면 종료 코드 0.
#   true  = 켬 — 아래 프로그램이나 창이 뜨면 녹화를 시작합니다   [기본]
#   false = 끔 — 프로그램·창을 감시하지 않고 이유를 남긴 뒤 끝납니다
watch = true
# 감지할 프로세스 이름 (확장자 포함, 대소문자 무시, 이름 전체가 같아야 함).
# 문자열 목록. 예: ["Zoom.exe"]. 비우면 프로세스로는 감지하지 않습니다.
# watch_processes 와 watch_window_titles 가 둘 다 비면 감시가 바로 끝납니다.
watch_processes = ["Zoom.exe", "Webex.exe", "Teams.exe"]
# 감지할 창 제목 부분 문자열 (대소문자 무시, Windows 에서만).
# 문자열 목록. 예: ["회의 중"]. 비우면 창 제목으로는 감지하지 않습니다.
# 너무 흔한 단어를 넣으면 계속 감지돼 녹화가 끝나지 않고 이어집니다(max_duration_minutes 마다
# 파일을 끊어 새 녹화).
watch_window_titles = []
# 감지 주기(초). 이 간격으로 프로세스·창 목록을 다시 봅니다.
watch_interval_sec = 15
# 대상이 사라지고 이 시간(초)이 지나면 녹화를 종료합니다.
# 그 사이 다시 나타나면 기다림을 처음부터 다시 셉니다.
watch_stop_grace_sec = 60

# ---------------------------------------------------------------------
# [recording.upload] 녹화 파일을 어디에 올릴지에 대한 안전장치
# ---------------------------------------------------------------------
[recording.upload]
# 대상 저장소가 공개(public)일 때 녹화를 올릴지.
# 녹화에는 교수님·학생 목소리와 화면이 들어갑니다. 저장소가 public 이면 누구나 받을 수 있습니다.
# 저장소 공개 여부를 못 읽으면(네트워크 실패 등) 막지 않습니다.
#   true  = 켬 — 저장소가 공개(public)면 녹화를 올리지 않고 PC 에만 남깁니다
#   false = 끔 — 저장소가 공개인지 확인하지 않고 올립니다   [기본]
block_public = false

# ---------------------------------------------------------------------
# [recording.guard] 녹화 지킴이 — python -m syncnote record guard
#
# 컴퓨터가 켜져 있고 녹화 중이 아닐 때 늘, 모든 녹화가
#   조각 → 파일 → 검사 통과 → 업로드 → 릴리스에서 확인
# 까지 가도록 몇 분마다 확인하고, 단계가 틀어지면 되돌려 다시 합니다.
# (꺼진 녹화의 조각 합치기, 망가진 파일 다시 만들기, 못 올린 것 올리기,
#  릴리스에서 사라졌거나 크기가 다른 것 다시 올리기)
# 지금 상태 보기: python -m syncnote record guard --status
# ---------------------------------------------------------------------
[recording.guard]
# 녹화 지킴이 스위치. 작업 스케줄러의 RecordGuard 가 로그온 때와 15분마다 띄웁니다.
#   true  = 켬 — 녹화 중이 아닐 때 몇 분마다 녹화 파일을 확인하고 못 올린 것을 올립니다   [기본]
#   false = 끔 — 확인하지 않고 이유를 남긴 뒤 끝납니다(녹화가 끝날 때 올리는 것은 그대로)
enabled = true
# 확인 간격(분). 1 이상.
interval_minutes = 5
# 다음 수업 시작 이 시간(분) 전부터는 쉽니다(녹화 시작과 CPU·네트워크를 다투지 않게).
quiet_before_class_minutes = 10
# 같은 파일에서 이만큼 실패하면 '격리' 로 두고 하루에 한 번만 다시 시도합니다.
max_attempts = 6
# 올린 뒤 릴리스에 같은 이름·크기의 파일이 정말 있는지 확인할지.
#   true  = 켬 — 릴리스에서 확인하고, 없거나 크기가 다르면 다시 올립니다   [기본]
#   false = 끔 — 업로드 기록만 믿습니다(네트워크 조회를 줄임)
verify_remote = true

# ---------------------------------------------------------------------
# [recording.terminal] 터미널 녹음기 — FFmpeg / SoX / arecord
#
#   python -m syncnote audio record            지금 바로 (아래 값대로)
#   python -m syncnote audio record --vad      소리가 날 때만 (SoX)
#   python -m syncnote audio tools             설치된 도구와 실행될 명령 보기
#
# 화면 없이 **소리만** 받습니다. macOS·Linux 에서도 돌고, cron 이나
# 작업 스케줄러에 그대로 걸 수 있습니다. 자세한 내용은
# docs/TERMINAL_AUDIO.md 에 있습니다.
#
#   도구     지원 OS                 핵심 기능                     쓸 만한 때
#   ffmpeg  Windows/macOS/Linux     -t 로 정확한 길이, mp3 인코딩   예약 시간제 녹음
#   sox     Windows/macOS/Linux     silence 로 소리 감지 녹음       소리 날 때만 기록
#   arecord Linux                   설치 불필요, 초경량             서버·라즈베리파이
# ---------------------------------------------------------------------
[recording.terminal]
# 녹음 도구. 허용 값은 아래 넷이고, 그 밖의 값은 설정 오류입니다.
#   "auto"    = ffmpeg -> sox -> arecord(리눅스) 순으로 있는 것을 씁니다.  [기본]
#   "ffmpeg"  = ffmpeg 만 씁니다.
#   "sox"     = SoX 만 씁니다.
#   "arecord" = arecord 만 씁니다(리눅스 전용, wav 만).
# vad = true 면 auto 는 Silero VAD(onnxruntime·모델 파일)가 있으면 그것으로,
# 없으면 sox 로 갑니다. ffmpeg/arecord 를 직접 고르고 vad = true 면 오류입니다.
backend = "auto"

# 받을 소리. 허용 값은 아래 둘이고, 그 밖의 값은 설정 오류입니다.
# "mic"    : 마이크(기본 입력 장치)  [기본]
# "system" : 스피커로 나가는 소리.
#            Linux 는 ffmpeg/sox 가 @DEFAULT_MONITOR@ 로 바로 됩니다(arecord 는 device 필요).
#            macOS 는 BlackHole 같은 가상 장치를 깔고 device 에 적어야 합니다.
#            Windows 의 ffmpeg/sox 는 안 됩니다 — `record start`(WASAPI 루프백)를 쓰세요
#            (vad 를 켜고 backend 가 auto 라 Silero VAD 로 가면 루프백으로 됩니다).
source = "mic"

# 비우면 기본 장치. 형식은 도구마다 다릅니다.
# 단, Windows 의 ffmpeg(dshow)는 기본 장치가 없어 이름을 꼭 적어야 합니다(비우면 오류).
#   ffmpeg Windows : dshow 이름  (ffmpeg -list_devices true -f dshow -i dummy)
#   ffmpeg macOS   : avfoundation 번호, 예 "0"  (ffmpeg -f avfoundation -list_devices true -i "")
#   ffmpeg Linux   : pulse 소스 이름  (pactl list short sources)
#   arecord        : ALSA 장치, 예 "plughw:1,0"  (arecord -L)
device = ""

# 녹음 길이(초). 0보다 커야 합니다. ffmpeg 의 -t, arecord 의 -d, sox 의 trim 으로 들어갑니다.
# vad = true 일 때는 '최대' 길이입니다.
seconds = 3600

# 저장 형식. 허용 값은 "wav"(기본) / "mp3" / "flac" 셋이고, 그 밖의 값은 설정 오류입니다.
# mp3 는 ffmpeg 만 됩니다(sox 는 오류). arecord 는 wav 만 됩니다.
format = "wav"

# 파일 이름. strftime 형식이라 날짜·시각별로 쌓이고 덮어쓰지 않습니다.
# 셸의 record_$(date +%Y%m%d_%H%M%S).mp3 와 같습니다. 확장자는 format 이 붙입니다.
# 같은 이름이 이미 있으면 겹치지 않는 이름으로 바꿔 저장합니다.
filename = "record_%Y%m%d_%H%M%S"

# 비우면 <데이터 폴더>/recordings/<날짜>/terminal
# 경로를 적으면 그 폴더에 저장합니다(환경변수와 ~ 를 풀어 씀).
out_dir = ""

# 샘플레이트(Hz). ffmpeg -ar, sox -r 로 들어갑니다(arecord 는 44100·2채널이면 -f cd).
samplerate = 44100
# 채널 수. 2 = 스테레오, 1 = 모노. ffmpeg -ac, sox -c 로 들어갑니다.
channels   = 2

# 소리 감지 녹음 (SoX 의 silence 효과)
#   rec out.wav silence 1 0.1 3% 1 3.0 3%
#   = 3% 이상 소리가 0.1초 이어지면 시작, 3% 아래로 3초 이어지면 끝
#   true  = 켬 — 소리가 날 때만 녹음합니다(명령줄 --vad 와 같음)
#   false = 끔 — seconds 에 적은 시간 동안 계속 녹음합니다   [기본]
vad           = false
# 소리 감지 문턱값. "3%" 같은 백분율 또는 "-40d" 같은 dB 형식만 됩니다(그 밖은 설정 오류).
# SoX 로 녹음할 때만 씁니다(Silero VAD 로 가면 무시, Silero 는 자체 문턱 0.5).
vad_threshold = "3%"
# 이 시간(초) 이상 문턱값을 넘는 소리가 이어지면 녹음을 시작합니다. 0 이상.
# SoX 로 녹음할 때만 씁니다(아래 vad_stop_sec 은 Silero 에서도 끝 판정에 씀).
vad_start_sec = 0.1
# 이 시간(초) 이상 문턱값 아래로 조용하면 녹음을 끝냅니다. 0보다 커야 합니다.
vad_stop_sec  = 3.0

# ---------------------------------------------------------------------
# [[recording.timetable]] 시간표
#   record schedule([recording.triggers] schedule 이 켜져 있을 때) · stream schedule 과
#   녹화 메타데이터가 씁니다.
#   day: mon tue wed thu fri sat sun
#   시간은 24시간제 HH:MM, 로컬 시간 기준입니다.
#
#   아래는 예시입니다. 실제 시간표로 바꾸고 필요 없는 줄은 지우세요.
# ---------------------------------------------------------------------
#   language: 이 수업만 다른 언어로 전사합니다(선택).
#             생략하면 위 [transcribe] 의 language 를 씁니다.
#
# [[recording.timetable]]
# name  = "자료구조"
# day   = "mon"
# start = "09:00"
# end   = "10:50"
#
# [[recording.timetable]]
# name  = "영어2"
# day   = "tue"
# start = "11:00"
# end   = "12:50"
# language = "en"          # 영어 수업 -> 반드시 지정하세요
#
# [[recording.timetable]]
# name  = "기초웹프로그래밍"
# day   = "wed"
# start = "13:00"
# end   = "14:50"
# language = "ko+en"       # 한국어 설명 + 영어 용어가 많이 섞이는 수업
#
#   선택 칸: course_id(eClass 과목코드), room, professor, color("#RRGGBB").
#   녹화에는 name/day/start/end/language 만 쓰이고, 나머지는 편집기 표시용입니다.
#
# ---------------------------------------------------------------------
# [[recording.holidays]] 쉬는 날
#   이 날짜의 수업은 녹화·송출 일정에서 건너뜁니다.
#
# [[recording.holidays]]
# date = "2026-12-25"
# name = "성탄절"
#
# 손으로 적는 대신 GUI 로 편집할 수 있습니다(PySide6 필요):
#   python -m syncnote timetable edit
#   편집기는 이 파일 맨 아래 '# >>> syncnote 시간표 편집기' 표시줄 사이만
#   다시 쓰고, 손으로 적은 [[recording.timetable]] 은 주석 처리합니다.


# =====================================================================
#  2-1. 실시간 오디오 송출 (Tailscale 망 안에서만)
#
#   python -m syncnote stream start          지금 송출 (링크 -> GitHub 이슈)
#   python -m syncnote stream schedule       시간표대로 수업마다 송출
#   python -m syncnote stream link           링크가 어떻게 만들어질지 미리 보기
#   python -m syncnote stream cleanup        비정상 종료로 남은 tailscale serve 정리
#
# 소리를 mp3/aac 로 인코딩해 내장 서버(또는 Icecast)로 내보내고,
# Tailscale 로 같은 tailnet 의 기기만 들을 수 있게 합니다. 링크가 생길
# 때마다(시작할 때, 기기 주소가 바뀔 때) 저장소 이슈로 올립니다.
# 자세한 내용: docs/STREAMING.md
#
# 주의: 강의 소리는 교수와 학교의 저작물입니다. tailnet 밖(funnel)으로
#       내보내거나 public 저장소에 링크를 올리면 공중송신이 됩니다.
# =====================================================================
[stream]
# 송출 서버 종류. 가능한 값:
# "builtin" : 내장 HTTP 오디오 서버. 설치할 것이 없습니다.          [기본·권장]
# "icecast" : Icecast(오픈소스 스트리밍 서버)로 밉니다. Icecast 를 따로
#             띄워 두고  python -m syncnote secrets set icecast  로 소스
#             비밀번호를 저장하세요. 접속 토큰은 쓰지 않습니다(require_token 무시).
#             Tailscale 이 켜져 있고 mode 가 "funnel" 이면 쓸 수 없습니다(설정 오류).
server = "builtin"

# 무엇을 송출할지. 가능한 값:
# "system" : 스피커로 나가는 소리(온라인 강의 소리)   [기본]
# "mic"    : 마이크
source = "system"
# source = "mic" 일 때 마이크 소리를 자동으로 키움([recording.audio] mic_auto_gain 과 같은 방식).
#   true  = 켬 — 송출할 때 마이크 소리를 자동으로 키웁니다   [기본]
#   false = 끔 — 받은 그대로 송출합니다
mic_auto_gain = true
# 최대 몇 dB 까지 키울지. 0 이면 끔.
mic_auto_gain_max_db = 40.0
# 소리를 받는 방법. 가능한 값:
# "auto"      : soundcard 모듈이 있으면 soundcard, 없으면 ffmpeg   [기본]
# "soundcard" : WASAPI 루프백 포함. Windows 에서 system 은 이것만 됩니다
# "ffmpeg"    : ffmpeg 가 장치를 직접 엶 (dshow / avfoundation / pulse)
capture = "auto"
# 장치 이름. 비우면 기본 장치(단, Windows 의 ffmpeg(dshow)는 이름이 꼭 필요).
# soundcard 는 이름 일부, ffmpeg 는 장치 이름/번호.
# 이 장치가 안 되면 아래 fallback_default_device 에 따라 기본 장치로 되돌립니다.
device = ""

# 인코딩 코덱. 가능한 값: "mp3" [기본] / "aac". 둘 다 중간에 들어온 청취자도 바로 재생됩니다.
codec        = "mp3"
# 비트레이트(kbps). 0 보다 커야 합니다. 높을수록 음질↑·데이터↑.
bitrate_kbps = 96        # 말소리는 64 로도 충분합니다
# 샘플레이트(Hz). 0 보다 커야 합니다.
samplerate   = 48000
# 채널 수. 1 = 모노, 2 = 스테레오. 0 보다 커야 합니다.
channels     = 2

# 내장 서버 포트(1~65535). 듣기 주소는 <호스트><path>, 재생 페이지는 <호스트>/
# 서버가 icecast 이면 이 값 대신 [stream.icecast] 의 port 를 씁니다.
port = 8765
# 내장 서버가 열릴 주소. 비우면 자동: direct 모드는 이 기기의 Tailscale IP,
# 그 밖(serve/funnel/Tailscale 끔)은 127.0.0.1. 값을 적으면 그 주소로만 엽니다.
# "0.0.0.0" 으로 두면 같은 와이파이의 다른 사람도 닿을 수 있습니다.
bind = ""
# 오디오 스트림 경로. '/' 로 시작해야 하고 "/" 나 "/status" 는 안 됩니다(재생 페이지·상태가 씀).
path = "/live"
# 내장 서버의 / 에 간단한 재생 페이지를 띄울지
#   true  = 켬 — 듣기 주소 외에 브라우저용 재생 페이지도 엽니다   [기본]
#   false = 끔 — 듣기 주소(path)만 열고 재생 페이지는 열지 않습니다
player_page = true
# 재생 페이지의 제목(브라우저 탭 이름)
title = "실시간 송출"

# 동시 청취자 상한. 넘으면 새 청취자는 503 으로 거절. 0 = 무제한   [기본 0]
max_listeners = 0
# 청취자별 버퍼(KB, 0 보다 커야 함). 이만큼 밀린 청취자 한 명만 끊습니다
# (송출은 계속, 그 청취자는 다시 접속하면 됨).
client_buffer_kb = 2048

# 접속 토큰. 링크 끝에 ?t=.. 로 붙습니다. 링크(토큰)를 받은 사람만 듣게 합니다.
# Tailscale 이 켜져 있고 funnel(기본)이면 끌 수 없습니다(설정 오류).
# 서버가 icecast 면 무시됩니다.
#   true  = 켬 — 링크의 토큰이 맞는 사람만 들을 수 있습니다   [기본]
#   false = 끔 — 주소만 알면 누구나 들을 수 있습니다
require_token = true
# 고정 토큰. 비우면 송출마다 무작위로 새로 만듭니다(권장). 고정하려면 12자 이상.
token = ""
# token 이 비었을 때 무작위 토큰의 바이트 수(0 보다 커야 함, 8 미만이면 8 로 씀)
token_bytes = 16

# --- 시간표가 최우선 ---
# [[recording.timetable]] 의 수업 시간 안이면 그 수업이 끝나는 시각에 끝나고,
# 그 전에는 아래 어떤 조건(최대 송출 시간, 청취자 없음, 장애)으로도 멈추지
# 않습니다(장애는 restart_on_failure = 0 일 때만 해당). 수업 밖에서 켠 송출이
# 수업 시간에 들어가면 그 수업을 넘겨받습니다.
# `python -m syncnote stream schedule` 은 시간표대로 기다렸다가 수업마다 송출합니다.
# stream schedule 은 이 값과 상관없이 늘 수업 끝에 마칩니다.
#   true  = 켬 — 손으로 켠 송출(stream start)도 수업이 끝나는 시각에 끝납니다   [기본]
#   false = 끔 — 손으로 켠 송출은 시간표와 상관없이 계속합니다
follow_timetable = true
# 송출할 수업 이름만 고르기 (비우면 시간표 전체). 예: ["자료구조", "운영체제"]
# 이름은 [[recording.timetable]] 의 name 과 같아야 합니다(없으면 설정 오류).
timetable_slots = []
# 수업 시작 몇 분 전부터 / 끝나고 몇 분 더(분, 0 이상). 0 = 수업 시간 그대로
pre_roll_minutes  = 0        # 수업 시작 몇 분 전부터
post_roll_minutes = 0        # 수업 끝나고 몇 분 더

# --- 멈춤 조건: 기본은 전부 '없음' ---
# 최대 송출 시간(분, 0 이상). 0 = 없음   [기본]. 닿으면 on_max_duration 대로 합니다.
max_duration_minutes = 0
# max_duration_minutes 에 닿았을 때. 가능한 값:
#   "rollback" : 멈추지 않고 인코더를 마지막으로 잘 돌던 상태로 새로 띄워
#                이어 갑니다(장시간 송출의 누적 문제 해소). 링크·이슈는 그대로.   [기본]
#   "stop"     : 멈춤 (시간표 수업 중에는 무시하고 rollback 처럼 이어 감)
on_max_duration = "rollback"
# 청취자가 이만큼(분, 0 이상) 없으면 멈춤. 0 = 없음   [기본]. 시간표 수업 중에는 무시.
# 내장 서버(builtin)에서만 셉니다.
idle_stop_minutes = 0
# 시작 후 이 시간(초, 0 이상) 동안 인코더가 살아 있고 소리가 실제로 나와야 링크를 올립니다.
# 장치가 틀려 바로 죽는 송출의 링크가 이슈로 올라가는 것을 막습니다. 0 = 확인 안 함.
min_uptime_sec = 5

# --- 롤백(복구) ---
# 인코더가 죽거나 장치가 사라지면 멈추지 않고 되돌립니다:
#   마지막으로 소리가 나온 장치 -> 설정한 device -> (fallback_default_device) 기본 장치
# 실패하면 restart_backoff_sec 부터 두 배씩, restart_backoff_max_sec 까지 늘려 가며 재시도.
# restart_on_failure : 한 번의 복구에서 허용하는 연속 실패 횟수(0 이상). 0 = 무제한   [기본]
#                      넘으면 송출을 끝냅니다(도중이면 "롤백 실패", 시작 직후면 "시작하지 못함").
restart_on_failure      = 0
# 첫 재시도 대기(초, 0 보다 커야 함)
restart_backoff_sec     = 5
# 재시도 대기의 상한(초, 0 보다 커야 함)
restart_backoff_max_sec = 120
# 설정한 장치가 안 될 때 기본 장치로 되돌릴지
# mic 일 때는 살아 있는 다른 마이크도 찾아봅니다.
#   true  = 켬 — 정한 장치가 안 되면 Windows 기본 장치로 바꿔 계속합니다   [기본]
#   false = 끔 — 기본 장치로 바꾸지 않고 device 에 적은 장치만 씁니다
fallback_default_device = true

[stream.tailscale]
# Tailscale 로 링크 열기
#   true  = 켬 — Tailscale 로 링크를 열고, 링크가 생기면 이슈를 올립니다   [기본]
#   false = 끔 — Tailscale 없이 이 PC 에서만 열고, 이슈도 올리지 않습니다
enabled = true
# 링크를 여는 방식. 가능한 값:
# "funnel" : tailscale funnel 로 HTTPS 링크를 엶. 듣는 사람은 Tailscale 앱이
#            없어도 링크(?t=토큰)만 있으면 들음. 토큰이 필수이고 server = "builtin" 만.   [기본]
# "serve"  : tailnet 안에만 HTTPS 로 (tailscale serve). 듣는 사람도 Tailscale 앱 필요
# "direct" : 이 기기의 Tailscale IP 에 HTTP 로 직접. 방화벽 허용이 필요할 수 있음
# serve/funnel 은 MagicDNS 이름이 있어야 합니다(관리 콘솔에서 MagicDNS·HTTPS 인증서 켜기).
# 송출하는 이 PC 에만 Tailscale 이 있으면 됩니다(scripts\setup.bat 이 설치).
mode = "funnel"
# serve/funnel 의 HTTPS 포트(1~65535). 443 이면 링크에 포트가 안 붙음
https_port = 443           # funnel 은 443, 8443, 10000 만 됩니다
# direct 모드 링크의 호스트 이름 (serve/funnel 은 늘 기기 이름 …ts.net 을 씀)
# direct 모드에서만 차이가 있고, serve·funnel 은 늘 기기 이름을 씁니다.
#   true  = 켬 — 링크에 기기 이름(…ts.net)을 씁니다   [기본]
#   false = 끔 — 링크에 100.x 로 시작하는 Tailscale IP 를 씁니다
use_magicdns = true
# tailscale 실행 파일 경로. 비우면 자동: 환경변수 TAILSCALE → PATH → 기본 설치 위치
exe = ""
# 이 간격(초, 0 이상)마다 tailnet 상태를 다시 읽어 링크가 바뀌면 다시 올리고,
# serve/funnel 설정이 사라졌으면 다시 켭니다. 0 = 안 봄
link_check_sec = 60
# Tailscale 연결을 기다릴지
# 기다리는 동안에도 소리는 먼저 송출합니다. 시간표 수업이 끝날 때까지 안 되면 끝납니다.
#   true  = 켬 — Tailscale 이 연결될 때까지 기다렸다가 링크를 올립니다   [기본]
#   false = 끔 — 기다리지 않고 지금 상태로 바로 링크를 만듭니다
require_online = true
# 이 HTTPS 포트를 이미 다른 serve/funnel 이 쓰고 있을 때
# 덮어쓰면 강제 종료로 남은 지난 송출의 serve 가 새 송출을 막지 않고, 한 포트에 송출 하나만
# 남습니다(중복 실행 방지). 같은 포트를 쓰던 다른 프로그램의 serve·funnel 도 덮어쓰고 끝날 때
# (teardown) 끕니다. 그 프로그램을 지키려면 끄거나 https_port 를 바꾸세요.
#   true  = 켬 — 같은 포트를 쓰는 serve·funnel 이 있어도 덮어쓰고 시작합니다   [기본]
#   false = 끔 — 같은 포트를 이미 쓰고 있으면 송출을 시작하지 않습니다
override_existing = true
# 끝날 때 이 프로그램이 켠 serve/funnel 을 끌지
#   true  = 켬 — 송출이 끝나면 이 프로그램이 켠 serve·funnel 을 끕니다   [기본]
#   false = 끔 — 송출이 끝나도 serve·funnel 을 켜 둔 채로 둡니다
teardown = true

[stream.icecast]
# server = "icecast" 일 때만. 링크의 포트·경로도 이 값을 씁니다.
# Icecast 서버 주소(호스트)
host  = "127.0.0.1"
# Icecast 포트(1~65535)
port  = 8000
# 마운트 경로. '/' 로 시작해야 합니다.
mount = "/live"
# 소스 계정 이름. 비밀번호는  python -m syncnote secrets set icecast  로 저장
user  = "source"

[stream.issue]
# 링크가 생길 때마다 저장소 이슈로 올립니다.
#   true  = 켬 — 링크가 생기거나 바뀌거나 끝나면 GitHub 이슈로 알립니다   [기본]
#   false = 끔 — 이슈를 만들지 않습니다(링크는 화면에만 나옴)
enabled = true
# 이슈를 올릴 저장소. 비우면 [github] 의 owner / repo
owner = ""
repo  = ""
# 이슈 제목. 쓸 수 있는 자리: {link} {player} {host} {tailnet} {mode} {label} {machine}
#   {source} {codec} {bitrate} {started} {until} {reason} {access_note} {token_note}
# 모르는 {이름} 은 그대로 남습니다.
title = "[실시간 송출] {label} — {started}"
# 이슈 본문. 비우면 기본 본문(표 형식). 직접 쓰려면 여러 줄 문자열 """ ... """ 로.
# 자리 표시는 title 과 같습니다.
body  = ""
# 이슈에 붙일 라벨 이름 목록. 비우면 라벨 없음
labels      = ["live-stream"]
# 라벨이 저장소에 없을 때 만들 색. 6자리 16진수(앞의 # 은 있어도 됨)
label_color = "d93f0b"     # 라벨이 없으면 이 색으로 만듭니다
# 담당자(GitHub 사용자 이름) 목록. 비우면 없음
assignees   = []           # 예: ["seongbin45"]
# 본문 맨 앞에 붙일 멘션(빈칸으로 이어 붙임). 적은 사람에게 GitHub 알림이 갑니다.
mentions    = []           # 예: ["@seongbin45"]
# 링크의 토큰을 이슈에 그대로 적을지
#   true  = 켬 — 이슈에 토큰이 들어간 링크를 그대로 적습니다   [기본]
#   false = 끔 — 이슈의 링크에서 토큰을 가립니다(토큰은 따로 전해야 함)
include_token = true
# 링크가 바뀌었을 때(기기 이름·IP 변경). 가능한 값:
#   "new"     : 새 이슈   [기본]
#   "comment" : 같은 이슈에 새 링크를 댓글로
#   "none"    : 아무것도 안 함
on_change = "new"
# on_change 가 "new" 일 때 옛 이슈를
# on_change 가 "new" 일 때만 씁니다.
#   true  = 켬 — 새 이슈를 만들면 옛 이슈에 새 이슈 번호를 남기고 닫습니다   [기본]
#   false = 끔 — 새 이슈를 만들어도 옛 이슈는 그대로 둡니다
close_previous  = true
# 끝날 때 댓글
# 롤백이 있었으면 그 횟수도 적습니다.
#   true  = 켬 — 송출이 끝나면 끝난 이유·길이·청취 수를 이슈에 댓글로 남깁니다   [기본]
#   false = 끔 — 송출이 끝나도 댓글을 남기지 않습니다
comment_on_stop = true
# 끝날 때 이슈를
#   true  = 켬 — 송출이 끝나면 이슈를 닫습니다   [기본]
#   false = 끔 — 송출이 끝나도 이슈를 열어 둡니다
close_on_stop   = true
# 같은 링크(토큰 고정 시)로 열린 이슈가 있으면
#   true  = 켬 — 같은 링크로 열린 이슈가 있으면 새로 만들지 않고 그 이슈를 이어 씁니다   [기본]
#   false = 끔 — 매번 새 이슈를 만듭니다
dedupe = true
# 올리기 전에 저장소가 private 이고 이슈가 켜져 있는지 확인
#   true  = 켬 — 공개(public) 저장소에는 이슈를 올리지 않습니다   [기본]
#   false = 끔 — 공개 저장소인지 확인하지 않고 올립니다(공개면 링크·토큰이 드러남)
require_private_repo = true
# 롤백으로 복구할 때마다 이슈에 댓글
#   true  = 켬 — 송출을 복구할 때마다 이슈에 '같은 링크로 다시 연결하세요' 댓글을 남깁니다
#   false = 끔 — 송출을 복구할 때 댓글을 남기지 않습니다   [기본]
comment_on_rollback = false


# =====================================================================
#  2-2. 활동 기록 — PDF 폼 "필드 값"(키 입력 아님)
#
#   python -m syncnote activity gate      이 기기가 봉인 저장을 허용받는지 점검
#
# 녹음/녹화와 같은 타임라인에, PDF 폼에 입력한 값을 전사처럼 봉인 저장합니다.
# 키 입력을 가로채지 않습니다 — 어댑터가 커밋된 "필드 값"만 읽습니다.
# **전용 기기에서만**, 자격증명 필드는 스펙 플래그로 제외, 하드웨어/OS 게이트를
# 통과해야만 저장. 기본 전부 꺼짐. 자세한 내용: docs/ACTIVITY.md
#
# 책임 고지: 이 기능은 당신 전용 기기에서만 쓰세요. 기기를 공유하면 타인의
# 입력까지 담길 수 있습니다. public 저장소에 올리지 마세요.
# =====================================================================
[activity]
# 활동 기록 전체 스위치
# watch-acrobat 은 adapters.acrobat_js 도 켜야 동작합니다.
#   true  = 켬 — 활동 기록 기능이 동작합니다
#   false = 끔 — 활동 기록 기능이 아무것도 하지 않고 끝납니다   [기본]
enabled = false
# 전용 기기(당신만 그 키보드를 만짐)인지 선언
# 지금 코드는 설정 점검 경고와 activity gate 화면에만 씁니다(저장을 직접 막지는 않음).
#   true  = 켬 — 이 PC 를 활동 기록 전용 기기로 봅니다
#   false = 끔 — 전용 기기가 아닌 것으로 보고, 설정 점검이 경고합니다   [기본]
machine_is_private = false
# 수집 창을 [[recording.timetable]] 수업 시간에 묶음 (지금 코드는 읽지 않음)
#   true  = 켬 — 수업 시간에만 기록합니다 — 아직 구현되지 않아 지금은 달라지는 것이 없습니다   [기본]
#   false = 끔 — 시간과 상관없이 기록합니다 — 아직 구현되지 않아 지금은 달라지는 것이 없습니다
follow_timetable = true
# 수업 이름 목록(문자열). 비우면 전체 (지금 코드는 읽지 않음)
timetable_slots = []
# 필드 값을 언제 읽나(키 후킹 아님). 가능한 값(지금 코드는 검증만 하고 읽지 않음):
#   "field_commit"   : blur/change/Enter 때   [기본]
#   "document_save"  : 문서를 저장할 때
#   "field_debounce" : 입력이 debounce_ms 동안 멈췄을 때
keys_level = "field_commit"
# field_debounce 의 대기 시간(밀리초, 0 보다 커야 함). 지금 코드는 읽지 않음
debounce_ms = 800
# 웹 어댑터 허용 오리진(정확히 일치). 비우면 웹에서 온 값은 전부 버림.
# Adobe 기본 포함, PDF.js 데모(mozilla.github.io)는 제외.
# 당신 뷰어 오리진은 여기 한 줄 추가. `activity origins allow` 로도 됩니다(다음 증분).
origins = ["https://acrobat.adobe.com", "https://documentcloud.adobe.com"]
# 데스크톱 어댑터 프로세스 스코프. 비우면 데스크톱(Acrobat)에서 온 값은 전부 버림.
# 지금 코드는 목록이 비었는지만 봅니다(프로세스 이름 대조는 안 함).
process_allowlist = ["Acrobat.exe"]
# 업로드 방식. 가능한 값: "off" / "sealed_only"(봉인본만) [기본]. 지금 코드는 검증만 함
upload = "sealed_only"
# 수집 일시정지 단축키 (지금 코드는 읽지 않음)
pause_hotkey = "Ctrl+Alt+P"

# 안 쓰는 어댑터는 기능이 아니라 공격면이라 기본 꺼짐. 쓰는 것만 켜세요.
[activity.adapters]
# 브라우저 PDF.js (Firefox 내장 등). 오리진 스코프. 지금 코드는 읽지 않음
#   true  = 켬 — 브라우저 PDF.js 에서 기록합니다 — 아직 구현되지 않아 지금은 달라지는 것이 없습니다
#   false = 끔 — 브라우저 PDF.js 에서는 기록하지 않습니다   [기본]
pdfjs = false
# acrobat.adobe.com 등. 오리진 스코프. 지금 코드는 읽지 않음
#   true  = 켬 — acrobat.adobe.com 에서 기록합니다 — 아직 구현되지 않아 지금은 달라지는 것이 없습니다
#   false = 끔 — acrobat.adobe.com 에서는 기록하지 않습니다   [기본]
acrobat_web = false
# 데스크톱 Acrobat, 저장 시 필드 값 덤프. 전용 기기만.
#   true  = 켬 — activity watch-acrobat 이 데스크톱 Acrobat 저장 때 필드 값을 기록합니다
#   false = 끔 — activity watch-acrobat 이 아무것도 하지 않고 끝납니다   [기본]
acrobat_js = false
# 데스크톱 Acrobat, UIA. 최후 폴백. 전용 기기만. 지금은 설정 점검 경고에만 씀
#   true  = 켬 — 설정 점검이 경고만 합니다 — UIA 어댑터는 아직 구현되지 않았습니다
#   false = 끔 — UIA 어댑터를 쓰지 않습니다   [기본]
acrobat_uia = false

# 정책 엔진 — 자격증명/민감 필드 제외 + 저장 전 레드액션
[activity.policy]
# 비밀번호 필드(/Ff 비밀번호 플래그 · type=password · IsPassword)를 버림.
#   true  = 켬 — 비밀번호 칸의 값은 기록하지 않습니다   [기본]
#   false = 끔 — 설정 오류가 납니다(이 값은 끌 수 없습니다)
drop_password = true
# 서명 필드(/FT /Sig)
#   true  = 켬 — 서명 칸의 값은 기록하지 않습니다   [기본]
#   false = 끔 — 서명 칸의 값도 기록합니다
exclude_signature = true
# 리치텍스트 필드
#   true  = 켬 — 서식 있는 글(리치텍스트) 칸의 값은 기록하지 않습니다
#   false = 끔 — 서식 있는 글(리치텍스트) 칸의 값도 기록합니다   [기본]
exclude_richtext = false
# 이 이름(대소문자 무시, * ? 사용 가능)에 맞는 필드는 버림. 비우면 이름으로는 안 거름
name_blacklist = ["*ssn*", "*card*", "*cvv*", "*주민*", "*계좌*", "*password*", "*secret*"]
# 저장 전 카드번호(Luhn 확인)·주민번호 가림(완벽 아님)
#   true  = 켬 — 저장하기 전에 카드번호·주민번호를 가립니다(완벽하지는 않음)   [기본]
#   false = 끔 — 카드번호·주민번호를 가리지 않고 그대로 저장합니다
redact_patterns = true

# 하드웨어/OS 게이트 — 하나라도 실패하면 저장 거부(fail-closed)
# 각 항목: true = 그 검사를 함(실패하면 거부) [기본], false = 그 검사를 건너뜀.
# Windows 가 아니면 항목과 상관없이 늘 실패합니다.
[activity.gate]
# TPM 2.0 이 있고 저장 준비가 됐는지
#   true  = 켬 — TPM 2.0 이 준비돼 있는지 검사하고, 아니면 저장을 거부합니다   [기본]
#   false = 끔 — TPM 2.0 검사를 건너뜁니다
require_tpm2 = true
# UEFI Secure Boot 가 켜져 있는지
#   true  = 켬 — Secure Boot 가 켜져 있는지 검사하고, 아니면 저장을 거부합니다   [기본]
#   false = 끔 — Secure Boot 검사를 건너뜁니다
require_secure_boot = true
# VBS 와 HVCI(메모리 무결성)가 돌고 있는지
#   true  = 켬 — 메모리 무결성(VBS·HVCI)이 켜져 있는지 검사하고, 아니면 저장을 거부합니다   [기본]
#   false = 끔 — 메모리 무결성 검사를 건너뜁니다
require_vbs_hvci = true
# 관리자 권한이 아닌 창에서 실행했는지
#   true  = 켬 — 관리자 권한으로 실행했으면 저장을 거부합니다   [기본]
#   false = 끔 — 관리자 권한인지 검사하지 않습니다
require_not_elevated = true
# 디버거가 붙어 있지 않은지
#   true  = 켬 — 디버거가 붙어 있으면 저장을 거부합니다   [기본]
#   false = 끔 — 디버거 검사를 건너뜁니다
require_no_debugger = true
# TPM 원격증명(EK/quote). 미구현이라 켜면 늘 실패(fail-closed)
#   true  = 켬 — TPM 원격증명을 검사합니다 — 아직 구현되지 않아 늘 실패하고 저장을 거부합니다
#   false = 끔 — TPM 원격증명 검사를 건너뜁니다   [기본]
require_attestation = false
# 읽기(activity export 복호)에도 게이트를 적용할지
# 막혔을 때 --break-glass 로 한 번만 열 수 있습니다.
#   true  = 켬 — 검사에 실패하면 기록을 여는 것(복호)도 막습니다   [기본]
#   false = 끔 — 검사에 실패해도 경고만 하고 기록을 열어 줍니다
read_enforces_gate = true

# 저장·봉인
[activity.store]
# 봉인 DB 경로. 비우면 <데이터>/activity/activity.db
db_path = ""
# 데이터 키 파일 경로. 비우면 <데이터>/activity/dek.bin (DPAPI 봉인, Windows 전용)
dek_path = ""
# 봉인할 공개키. 비어 있으면 설정 점검이 경고합니다(지금 저장 코드는 이 값을 읽지 않음)
public_key = ""
# 키 보관 방식. 가능한 값: "tpm" 하나뿐 [기본]. 지금 코드는 검증만 함
# (TPM 요구는 [activity.gate] require_tpm2 가 실제로 검사)
key_storage = "tpm"
# Windows Hello 요구 (지금 코드는 읽지 않음)
#   true  = 켬 — Windows Hello 확인을 요구합니다 — 아직 구현되지 않아 지금은 달라지는 것이 없습니다   [기본]
#   false = 끔 — Windows Hello 확인을 요구하지 않습니다
require_hello = true
# 복구키
# 지금 코드는 경고에만 씀
# 꺼져 있으면 설정 점검이 경고합니다.
#   true  = 켬 — 설정 점검의 '복구 불가' 경고만 사라집니다 — 복구키 기능은 아직 없습니다
#   false = 끔 — 복구키 없이 씁니다 — 이 PC 가 고장 나면 기록을 되살릴 수 없습니다   [기본]
recovery_key = false
# 보관 일수(0 이상). 지금 코드는 검증만 하고 이 값으로 지우지 않음
retention_days = 0

# C(데스크톱 Acrobat) 사이드카 워처 — acrobat_js 어댑터가 떨군 필드 값을 읽어 봉인.
# 사이드카는 짧은 순간 평문입니다(워처가 읽고 즉시 삭제). 자세한 한계는 docs/ACTIVITY.md.
[activity.watch_acrobat]
# 사이드카(*.json)가 떨어지는 폴더. 비우면 <데이터>/activity/.staging
staging_dir = ""
# 폴더를 다시 보는 간격(초, 0 보다 커야 함)
poll_sec = 1.0
# 기동 시 이보다(분, 0 이상) 묵은 사이드카는 삭제(평문 잔존 방지). 0 = 기동 시 전부 삭제
sweep_minutes = 5


# =====================================================================
#  3. 음성 전사 (STT)
# =====================================================================
[transcribe]
enabled = true   # 전사 전체 스위치
                 # (이 줄은 [transcribe] 바로 아래에 둡니다 — Actions 가 이 줄을 찾아 끕니다)
                 #   true  = 켬 — 녹화한 소리를 글로 옮깁니다(아래 batch·realtime 설정대로)   [기본]
                 #   false = 끔 — 녹화한 소리를 글로 옮기지 않습니다(실시간 전사도 꺼짐)

# 엔진. 가능한 값:
#   "faster-whisper" : 로컬 실행. 무료, 인터넷 불필요.      [기본·권장]
#   "openai"         : OpenAI API. 유료, 음성이 외부로 전송됨.
# 주의: 지금 코드는 값을 검증만 하고 늘 faster-whisper 로 전사합니다("openai" 미구현).
engine = "faster-whisper"

# 전사 언어.
#
#   "ko"     한국어 고정. 가장 정확합니다.   [기본]
#   "en"     영어 고정. (그 밖의 Whisper 언어 코드도 됩니다: "ja" 등)
#   "ko+en"  둘 중에서 모델이 고르되, 다른 언어로는 가지 않게 막습니다.
#   "auto"   모델에 전적으로 맡깁니다. (빈 값도 같음)
#
# !! 영어 수업이 있다면 이 값 하나로 두면 안 됩니다 !!
#   Whisper 는 지정한 언어로 '받아쓰려고' 합니다. 영어 음성을 "ko" 로
#   지정하면 소리 나는 대로 한글을 뱉습니다("디스 이즈 어 바이너리 트리").
#   그 과목 전사본은 통째로 쓸모없어집니다.
#   과목마다 다르게 주려면 아래 [[recording.timetable]] 의 language 를
#   쓰거나, 녹화할 때 --language en 을 붙이세요.
#
# 한국어 강의 중간의 영어 전문용어는 "ko" 로도 잘 처리됩니다.
# "auto" 로 두면 오히려 그 구간에서 일본어·중국어로 오판하는 일이 있습니다.
language = "ko"

# 결과 포맷 목록 (여러 개 선택 가능, 이 넷 밖의 값은 설정 오류)
#   txt  : 순수 텍스트
#   srt  : 자막 (타임코드 포함)
#   vtt  : 웹 자막
#   json : 단어 단위 타임스탬프 포함 (넣으면 단어 타임스탬프를 따로 계산)
formats = ["txt", "srt"]

# 어느 트랙을 전사할지. 가능한 값:
#   "system" : 스피커 소리   [기본]
#   "mic"    : 마이크
#   "both"   : 둘 다(트랙마다 따로)
# 온라인 강의라면 system, 교실 녹음이면 mic 입니다. 실시간 전사도 이 값을 따릅니다.
source_track = "system"

# ---------------------------------------------------------------------
[transcribe.batch]
# 녹화가 끝난 뒤 돌리는 정밀 전사. 이쪽이 본체입니다.
#   true  = 켬 — 녹화 세그먼트가 끝날 때마다 전사 대기열에 넣습니다   [기본]
#   false = 끔 — 녹화가 끝나도 전사 대기열에 넣지 않습니다
enabled = true

# 모델 크기: tiny / base / small [기본] / medium / large-v3
#   저사양 노트북(GPU 없음) 기준 1시간 음성 처리 시간 대략치
#     tiny   ~2분   |  base  ~4분   |  small ~10분
#     medium ~30분  |  large ~60분+
#   저사양이면 "small" 이 품질/시간 균형점입니다. 처음 쓸 때 모델을 내려받습니다.
model = "small"

# 연산 장치. 가능한 값:
#   "auto" : CUDA GPU 가 있으면 GPU(VRAM 을 알 수 있고 5GB 미만이면 CPU), 아니면 CPU   [기본]
#   "cpu"  : CPU 만
#   "cuda" : NVIDIA GPU (없으면 경고)
device = "auto"

# 연산 정밀도. CPU 에서는 "int8" 이 가장 빠릅니다.   [기본 "int8"]
# 예: "int8", "float16", "int8_float16", "float32". CPU 에서 float16 류는 int8 로 바뀝니다.
# 비우면 자동(CPU 는 int8, GPU 는 지원하는 것 중 float16 → int8_float16 → float32).
compute_type = "int8"

# 사용할 CPU 스레드 수. 0 = 자동(코어 수 - 1)   [기본].
# 전부 쓰면 노트북이 멈춘 듯 느려집니다.
cpu_threads = 0

# 전사를 녹화 직후 바로 돌릴지, 아니면 대기열에 쌓아뒀다가
# 나중에 `python -m syncnote transcribe queue` 로 한 번에 돌릴지. 가능한 값:
#   "immediate" : 녹화 종료 직후 실행
#   "queue"     : 대기열에만 넣음 (배터리/발열에 유리)  [기본·저사양 권장]
mode = "queue"

# 무음 구간 건너뛰기(VAD). 쉬는 시간이 긴 강의에서 시간을 크게 줄입니다.
#   true  = 켬 — 말소리가 없는 구간은 건너뛰고 전사합니다   [기본]
#   false = 끔 — 무음 구간까지 처음부터 끝까지 전사합니다
vad_filter = true

# ---------------------------------------------------------------------
[transcribe.realtime]
# !! 저사양 노트북에서는 켜지 마세요 !!
# 녹화와 동시에 CPU를 쓰기 때문에 프레임 드랍과 음성 끊김이 생깁니다.
# 켜야 한다면 recording.video.fps 를 5 로 낮추고 model 을 tiny 로 두세요.
# 실시간 결과는 어디까지나 '임시본'(<라벨>_realtime.txt)이고, 정밀본은 녹화 뒤 batch 가 따로 만듭니다.
# 켜려면 recording.audio.enabled 도 켜져 있어야 합니다(아니면 설정 오류).
#   true  = 켬 — 녹화하면서 동시에 글로 옮깁니다
#   false = 끔 — 실시간으로는 전사하지 않습니다(녹화 뒤 전사는 그대로)   [기본]
enabled = false

# 모델 크기(위 batch 와 같은 선택지). 실시간이 켜져 있을 때 tiny·base 가 아니면
# 설정 점검이 경고합니다.
model        = "tiny"
# 연산 장치: "auto" / "cpu" [기본] / "cuda" (뜻은 batch 와 같음)
device       = "cpu"
# 연산 정밀도 (batch 와 같음)
compute_type = "int8"
# CPU 스레드 수. 0 = 자동(코어 수 - 1)
cpu_threads  = 2

# 몇 초 단위로 끊어서 전사할지(초, 0 보다 커야 함). 짧을수록 반응이 빠르지만 문장이 잘립니다.
chunk_sec   = 8
# 앞 구간과 겹치는 길이(초). 문장 잘림을 완화합니다.
overlap_sec = 1.5

# 실시간 전사 결과를 화면에 띄울지 (콘솔 출력)
#   true  = 켬 — 실시간 전사 결과를 화면에도 보여 줍니다   [기본]
#   false = 끔 — 실시간 전사 결과를 파일에만 씁니다
print_to_console = true

# ---------------------------------------------------------------------
# [transcribe.cleanup] 지어낸 문장 걸러내기
#
#   Whisper 는 유튜브 자막으로 학습돼서, 무음 구간을 만나면 자막 상투어를
#   지어냅니다. 강의 녹화는 판서 시간, 질문 대기, 쉬는 시간처럼 무음이
#   길어서 이게 특히 잘 생깁니다. 걸러내지 않으면 전사본 곳곳에
#   "시청해주셔서 감사합니다" 가 박힙니다.
# ---------------------------------------------------------------------
[transcribe.cleanup]
#   true  = 켬 — 아래 규칙으로 모델이 지어낸 문장을 지웁니다   [기본]
#   false = 끔 — 아래 규칙을 모두 끄고, 빈 구간만 지웁니다
enabled = true

# 알려진 상투어 목록(+ extra_phrases)과 정확히 일치하면 버립니다(공백·문장부호는 정리 후 비교).
# 교수가 이 문장을 그대로 말할 확률은 사실상 없지만, 오탐이 걱정되면 끄세요.
#   true  = 켬 — 알려진 상투어(+ extra_phrases)와 똑같은 문장을 지웁니다   [기본]
#   false = 끔 — 상투어 문장을 지우지 않습니다(extra_phrases 도 함께 꺼짐)
drop_hallucinations = true

# 모델이 스스로 매긴 '무음 확률'(0~1) 이 이 값을 넘으면 텍스트를 믿지 않습니다.
# 낮출수록 공격적으로 지웁니다. 0 이면 이 검사(와 짧은 구간 무음 검사)를 끕니다.
no_speech_threshold = 0.85

# Whisper 자체 기본 규칙도 함께 적용합니다:
#   무음 확률 > 0.6  '그리고'  평균 확신도 < -1.0  이면 버립니다.
# 두 신호가 같이 나쁠 때만 적용하므로 위 단독 임계값보다 오탐이 적고,
# 0.6~0.85 구간에서 모델이 확신 없이 지어낸 문장을 잡아냅니다.
#   true  = 켬 — 두 신호가 함께 나쁜 문장(확신 없이 지어낸 문장)을 지웁니다   [기본]
#   false = 끔 — 이 규칙으로는 문장을 지우지 않습니다
use_logprob_rule = true

# 같은 문장이 연속으로 이 횟수를 넘으면 반복 루프로 보고 이후를 버립니다.
# 0 이면 이 검사를 끕니다.
max_repeats = 3

# 직접 추가할 문구 목록. 특정 강의에서만 반복되는 잡음 문구가 있을 때 넣으세요.
#   예: extra_phrases = ["자 그러면", "에 그러니까"]
# 비우면 기본 상투어 목록만 씁니다.
extra_phrases = []

# ---------------------------------------------------------------------
[transcribe.openai]
# engine = "openai" 일 때만 사용. (지금 코드는 이 섹션을 읽지 않습니다 — 미구현)
# API 키는 여기 적지 말고: python -m syncnote secrets set openai
# OpenAI 전사 모델 이름
model = "whisper-1"
# 파일이 25MB를 넘으면 이 길이(분)로 잘라서 보냅니다.
chunk_minutes = 10


# ---------------------------------------------------------------------
[backup.home]
# 강의실 PC 의 홈 디렉터리(%USERPROFILE%)를 매일 GitHub 릴리스에 올립니다.
#   python -m syncnote backup home      (예약 작업: HomeBackup)
# 릴리스 이름은 home-2026-11-13 처럼 날짜별이라 e-class/녹화와 섞이지 않습니다.
#
# 제외되는 것:
#   - 홈 바로 아래의 AppData 와 '.' 으로 시작하는 폴더(.vscode 등)
#   - 정션·심볼릭 링크 폴더('Application Data' 등)와 OneDrive 의 클라우드 전용 파일
#     (.lnk 바로가기 파일은 올라갑니다)
#   - 아래 exclude_names 에 맞는 이름(레지스트리, 키, 인증서 등)
#   - 이 프로그램의 데이터 폴더
# 하위 폴더 안의 .git, node_modules 등은 올라갑니다.
#   true  = 켬 — backup home 이 홈 폴더의 파일을 GitHub 에 올립니다
#   false = 끔 — backup home 이 아무것도 하지 않고 끝납니다   [기본]
enabled = false

# 백업할 폴더. 비우면 %USERPROFILE%. 사용자 홈이거나 그 아래 폴더만 됩니다(밖이면 거부).
root = ""
# 릴리스 태그 앞부분. <tag_prefix>-YYYY-MM-DD 로 올림. 비우면 설정 오류
tag_prefix = "home"

# 묶음(zip) 하나에 넣을 원본 크기 합계(MB). 0 보다 크고 1900 이하.
bundle_mb = 1800

# 올리지 않을 파일·폴더 이름(대소문자 무시, * ? 사용 가능).
# 비우면 레지스트리·개인 키까지 올라갑니다(설정 점검이 경고). 모든 이름에 맞는 '*' 는 설정 오류.
exclude_names = [
    "ntuser.*",
    "usrclass.dat*",
    "PaceKeyChain",
    ".env",
    ".env.*",
    "*.pem",
    "*.key",
    "*.pfx",
    "*.p12",
    "id_rsa*",
    "id_ecdsa*",
    "id_ed25519*",
    "id_dsa*",
    "*.kdbx",
    "config.toml",
]

[backup.home.prune]
# 올라간 파일을 로컬에서 지웁니다(디렉터리는 남김).  예약 작업: HomePrune
#   python -m syncnote backup prune     (--dry-run 은 지울 목록만 보여 줌)
# 로컬 기록이 아니라 GitHub 에 올라간 해시 사슬을 내려받아 확인하고,
# 지우기 직전에 파일 해시가 사슬의 값과 같을 때만 지웁니다.
# 지운 목록: <데이터>/logs/home-prune.log (기본 %LOCALAPPDATA%\sync-note\logs\home-prune.log)
#   true  = 켬 — 백업이 확인된 파일을 PC 에서 실제로 지웁니다
#   false = 끔 — 파일을 지우지 않습니다(--dry-run 으로 지울 목록만 볼 수 있음)   [기본]
enabled = false

# 올린 지 이 시간(시간, 0 이상)이 지난 것만 지웁니다. 0 = 올리자마자 지울 수 있음
min_age_hours = 24

