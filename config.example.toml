# =====================================================================
#  GYM-W-HALL-2F  설정 파일
# ---------------------------------------------------------------------
#  이 파일을 config.toml 로 복사한 뒤 값을 고치세요.
#    copy config.example.toml config.toml
#
#  config.toml 은 .gitignore 에 등록되어 있어 커밋되지 않습니다.
#  비밀번호/토큰은 여기 적지 말고 `python -m gymhall secrets set` 으로
#  Windows 자격증명 관리자(DPAPI)에 저장하세요.
# =====================================================================


# ---------------------------------------------------------------------
# [general] 공통 설정
# ---------------------------------------------------------------------
[general]
# 모든 산출물이 저장되는 최상위 폴더.
# 비워두면 %LOCALAPPDATA%\gym-w-hall-2f 를 씁니다.
# 장소를 옮겨 다니며 쓸 때는 OneDrive/드롭박스 폴더를 피하세요(동기화 충돌).
data_dir = ""

# 로그 수준: DEBUG / INFO / WARNING / ERROR
log_level = "INFO"

# 로그 파일 보관 일수
log_retention_days = 30

# 작업 이름. 여러 PC에서 같은 레포로 올릴 때 구분자로 쓰입니다.
# 비워두면 컴퓨터 이름을 씁니다.  예: "노트북", "집데스크탑"
machine_label = ""


# ---------------------------------------------------------------------
# [github] 릴리스 업로드
# ---------------------------------------------------------------------
[github]
enabled = true

# 산출물을 올릴 저장소. 소스코드 저장소와 달라도 됩니다.
owner = "class-from-kunsan"
repo  = "gym-w-hall-2f"

# 릴리스 태그 전략
#   "monthly"  -> recordings-2026-11   (한 달에 릴리스 1개, 에셋 누적)  [권장]
#   "weekly"   -> recordings-2026-W46
#   "daily"    -> recordings-2026-11-11
#   "single"   -> 아래 fixed_tag 하나만 계속 사용
tag_strategy = "monthly"
fixed_tag    = "archive"

# 태그 앞에 붙는 접두사. 종류별로 릴리스를 나누고 싶을 때 바꾸세요.
tag_prefix_eclass    = "eclass"
tag_prefix_recording = "recordings"

# 릴리스를 draft/prerelease 로 만들지 여부
draft      = false
prerelease = false

# GitHub 릴리스 에셋 1개당 상한은 2GiB 입니다.
# 이보다 큰 파일은 자동으로 .part001 .part002 ... 로 쪼개 올리고
# 복원용 manifest(.parts.json)와 합치기 스크립트를 같이 올립니다.
# 안전 마진을 둬서 기본값은 1900 MiB.
split_size_mb = 1900

# 업로드 재시도
retry_count    = 4
retry_backoff  = 2.0   # 초. 2 -> 4 -> 8 -> 16

# 업로드 성공 후 로컬 원본을 지울지 여부.
# 처음에는 반드시 false 로 두고, 신뢰가 생긴 뒤에 true 로 바꾸세요.
delete_local_after_upload = false
# 레포는 학기마다 새로 만듭니다(repo 이름에 학기를 넣으세요).
#   false = 없는 레포는 만들지 않고 무엇을 해야 하는지만 알려 줍니다(기본)
#   true  = 없으면 만듭니다. 개인 계정은 토큰의 repo 권한, 조직은 그
#           조직의 레포 생성 허용이 필요합니다.
create_missing_repos = false
repo_private = true


# =====================================================================
#  1. ECLASS 수집
# =====================================================================
[eclass]
enabled = true

# 로그인 페이지 주소. probe 로 확인한 실제 주소를 넣으세요.
base_url  = "https://eclass.kunsan.ac.kr"
login_url = "https://eclass.kunsan.ac.kr/"

# 학번(아이디). 비밀번호는 여기 적지 마세요.
#   python -m gymhall secrets set eclass
username = ""

# 브라우저 표시 여부. 처음 설정할 때는 false 로 두고 눈으로 확인하세요.
headless = true

# 페이지 로딩 대기 상한(밀리초). 학교망이 느릴 때 늘리세요.
timeout_ms = 30000

# 요청 간 최소 간격(초). 서버에 부담을 주지 않기 위한 값입니다.
# 0.5 미만으로 내리지 마세요.
request_delay_sec = 1.0

# 수집할 과목.
#   - 비워두면([]) 내 수강 목록 전체를 자동으로 돌립니다.
#   - 특정 과목만 원하면 과목명 일부나 과목코드를 넣으세요.
courses = []

# 제외할 과목 (courses 가 비어 있을 때 적용)
exclude_courses = []
# 읽을 쪽지함. RECEIVE(받은) / SEND(보낸) / WASTEBASKET(휴지통)
message_boxes = ["RECEIVE"]

# ---------------------------------------------------------------------
# 과목 = 레포지터리
#   이 PC 가 담당하는 과목과 그 과목이 올라갈 레포를 적습니다.
#   비워 두면 예전처럼 github.owner / github.repo 한 곳으로 전부
#   올라갑니다. 한 줄이라도 적는 순간, 여기 없는 과목은 수집은 하되
#   올리지 않습니다(로컬에만 남습니다).
#
#   두 겹 대괄호 [[...]] 입니다. 한 겹으로 적으면 목록이 아니라
#   표 하나가 되어 설정 검사에서 막힙니다.
#
#   위쪽 eclass.courses 와 헷갈리지 마세요.
#     eclass.courses       = 무엇을 수집할지 (이름 일부로 거르기)
#     eclass.course_repos  = 어디로 올릴지   (과목 -> 레포)
# ---------------------------------------------------------------------
# 비우면 github.owner / github.repo 한 곳으로 전부 올라갑니다.
course_repos = []

# 아래처럼 적으면 과목마다 다른 레포로 갑니다(주석을 푸세요).
# [[eclass.course_repos]]
# id   = "2026211043701"          # eClass 과목 코드(있으면 가장 정확)
# name = "자료구조"                # 폴더명·시간표와 맞추는 이름
# repo = "datastructure-2026-2"   # 이 과목이 올라갈 레포
# # owner = "다른조직"             # 생략하면 github.owner

# [[eclass.course_repos]]
# id   = "2026211043802"
# name = "운영체제"
# repo = "os-2026-2"



# ---------------------------------------------------------------------
# [eclass.menus] 메뉴별 수집 on/off
#   Eclass 과목 좌측 메뉴 기준입니다. 과목마다 있는 메뉴가 다르므로
#   없는 메뉴는 자동으로 건너뜁니다.
# ---------------------------------------------------------------------
[eclass.menus]
# --- 학습 목차 ---
curriculum     = true    # 학습 목차(주차별). 세 주차씩 보여 주는 화면을
                         #   좌우로 끝까지 넘겨 전 주차를 모읍니다.
lecture_list   = true    # 강의 목록 / 교안
# --- 과목 정보 ---
syllabus       = true    # 수업 계획서 (강의계획서)
course_info    = true    # 과목 정보
# --- 학습 정보 ---
notice         = true    # 공지사항  (본문 + 첨부)
qna            = true    # 질의응답
materials      = true    # 강의자료실 / 학습자료실 (첨부파일)
# --- 학습 활동 ---
assignment     = true    # 과제 명세 + 첨부. 제출물은 건드리지 않습니다.
attendance     = false   # 출석. 읽기 전용이지만 민감정보라 기본 off.
team           = false   # 팀활동
# --- 학습 현황 ---
progress       = false   # 학습 현황(진도율). 민감정보라 기본 off.
# --- 쪽지 ---
#   강의자료가 쪽지로도 옵니다. 보낸이 이름/사번은 익명화해 저장하고
#   본문은 그대로 둡니다. 과목이 아니라 계정 단위라 한 번만 돕니다.
message        = true
# --- 성적 ---
grade          = false   # 성적보기. 민감정보라 기본 off.

# ---------------------------------------------------------------------
#  !! 위험 구역 !!
#  시험 / 설문 / 토론은 "열람" 자체가 LMS에 기록으로 남습니다.
#    - 시험 페이지 진입 = 응시 시작으로 기록될 수 있음
#    - 설문 진입 = 참여로 집계될 수 있음
#    - 토론 조회 기록이 참여 점수에 반영되는 과목이 있음
#  자동화된 접근은 부정행위로 오해받을 수 있습니다.
#  아래를 켜더라도 "목록 제목만" 읽고 상세 페이지에는 절대 진입하지
#  않습니다. 그래도 책임은 사용자에게 있습니다.
# ---------------------------------------------------------------------
[eclass.risky]
# 이 값이 true 가 아니면 아래 3개는 무시됩니다.
i_understand_the_risk = false
exam       = false   # 시험
survey     = false   # 설문
discussion = false   # 토론


# ---------------------------------------------------------------------
# [eclass.upload] 무엇을 릴리스에 올릴지
#   수집은 하되 업로드는 안 할 수 있습니다(민감정보).
# ---------------------------------------------------------------------
[eclass.upload]
enabled = true
# 업로드에서 제외할 메뉴 (위 [eclass.menus] 키 이름 사용)
exclude_menus = ["grade", "attendance", "progress"]
# 확장자 화이트리스트. 비우면 전부 허용.
allow_extensions = []
# 이 용량(MB)을 넘는 첨부는 올리지 않고 로컬에만 둡니다. 0 = 제한 없음
max_file_mb = 0


# ---------------------------------------------------------------------
# [eclass.menu_ids]
#   eClass 좌측 메뉴는 내부적으로 menu_00092 같은 고정 ID 를 씁니다.
#   이 값들은 소스코드(src/gymhall/eclass/urls.py)에 이미 들어 있으므로
#   보통은 비워 두면 됩니다.
#
#   학교가 LMS 를 개편해 수집이 안 될 때만 채우세요. 새 ID 는
#     scripts\eclass_probe.bat
#   을 돌리면 나오는 report.json 에서 확인할 수 있습니다.
#
#   예:  assignment = "menu_00063"
# ---------------------------------------------------------------------
[eclass.menu_ids]
# curriculum   = ""
# lecture_list = ""
# attendance   = ""
# assignment   = ""
# team         = ""


# =====================================================================
#  2. 화면 녹화 + 음성 녹음
# =====================================================================
[recording]
enabled = true

# 녹화 파일 컨테이너. mkv 는 녹화 중 전원이 꺼져도 파일이 살아남습니다.
# mp4 는 정상 종료되지 않으면 파일이 깨집니다. mkv 를 권장합니다.
container = "mkv"

# 녹화를 이 길이(분)마다 끊어서 별도 파일로 만듭니다.
#   - 2GiB 릴리스 상한을 자연스럽게 피합니다
#   - 중간에 뻗어도 앞부분은 살아남습니다
#   - 0 = 끊지 않음 (권장하지 않음)
segment_minutes = 30

# 최대 녹화 길이(분). 깜빡 잊고 켜둔 채 퇴근하는 사고 방지.
max_duration_minutes = 240

# 녹화 시작 전/종료 후 여유 시간(분). 시간표 기반 자동 녹화에만 적용.
pre_roll_minutes  = 2
post_roll_minutes = 3

# ---------------------------------------------------------------------
[recording.video]
enabled = true

# 캡처 방식 (Windows)
#   "gdigrab"  : 호환성 최고, CPU 사용 보통.            [저사양 권장]
#   "ddagrab"  : Desktop Duplication. 빠르지만 ffmpeg 빌드를 탑니다.
backend = "gdigrab"

# 프레임레이트. 강의 슬라이드는 5~10 이면 충분합니다.
# 저사양 노트북에서 실시간 전사를 함께 켠다면 5 를 쓰세요.
fps = 10

# 해상도 축소. 0 이면 원본 그대로.
# 1920x1080 화면을 1280x720 으로 줄이면 용량과 CPU가 크게 줄어듭니다.
scale_width  = 1280
scale_height = 0        # 0 = 비율 유지

# x264 설정. crf 가 클수록 용량이 작고 화질이 낮습니다.
#   슬라이드 위주 강의: crf 30 전후도 충분히 읽힙니다.
preset = "veryfast"      # ultrafast > superfast > veryfast > faster > fast
crf    = 30

# 특정 창만 녹화하려면 창 제목을 넣으세요. 비우면 전체 화면.
# 예: "Zoom 회의"
window_title = ""

# 마우스 커서 표시
draw_mouse = true

# ---------------------------------------------------------------------
[recording.audio]
enabled = true

# 오디오 캡처 백엔드
#   "soundcard" : WASAPI 루프백을 직접 사용. 드라이버 설치 불필요.  [권장]
#   "dshow"     : ffmpeg DirectShow. VB-Cable 같은 가상 장치를 직접
#                 설치해야 시스템 소리를 잡을 수 있습니다.
backend = "soundcard"

samplerate = 48000
channels   = 2

# --- 트랙 1: 시스템 소리 (스피커로 나가는 소리 = 온라인 강의 소리) ---
system_enabled = true
# 비우면 현재 기본 재생 장치를 자동으로 씁니다.
# 특정 장치를 고르려면 `python -m gymhall devices` 로 이름을 확인하세요.
system_device = ""
system_gain_db = 0.0

# --- 트랙 2: 마이크 ---
mic_enabled = true
mic_device  = ""
mic_gain_db = 0.0

# 두 트랙을 최종 파일에 어떻게 넣을지
#   "separate" : 별도 트랙 2개로 저장. 나중에 분리 가능.     [권장]
#   "mixed"    : 하나로 합침. 파일이 작지만 분리 불가.
#   "both"     : 별도 트랙 2개 + 합친 트랙 1개 (총 3트랙).
track_layout = "separate"

# 무음 감지. 이 시간(초) 이상 양쪽 다 무음이면 경고 로그를 남깁니다.
# (장치를 잘못 골랐을 때 3시간 뒤에야 알게 되는 사고 방지)
silence_warn_sec = 60

# ---------------------------------------------------------------------
# [recording.triggers] 언제 녹화를 시작할지
# ---------------------------------------------------------------------
[recording.triggers]
# (A) 수동 실행 — 바탕화면 바로가기 / 터미널
manual = true

# (B) 시간표 기반 자동
schedule_enabled = false

# (C) 특정 프로그램/창이 뜨면 자동 시작
watch_enabled = false
# 감지할 프로세스 이름 (확장자 포함, 대소문자 무시)
watch_processes = ["Zoom.exe", "Webex.exe", "Teams.exe"]
# 감지할 창 제목 부분 문자열
watch_window_titles = []
# 감지 주기(초)
watch_interval_sec = 15
# 대상이 사라지고 이 시간(초)이 지나면 녹화를 종료합니다.
watch_stop_grace_sec = 60

# ---------------------------------------------------------------------
# [[recording.timetable]] 시간표
#   schedule_enabled = true 일 때만 사용됩니다.
#   day: mon tue wed thu fri sat sun
#   시간은 24시간제 HH:MM, 로컬 시간 기준입니다.
#
#   아래는 예시입니다. 실제 시간표로 바꾸고 필요 없는 줄은 지우세요.
# ---------------------------------------------------------------------
#   language: 이 수업만 다른 언어로 전사합니다(선택).
#             생략하면 위 [transcribe] 의 language 를 씁니다.
#
# [[recording.timetable]]
# name  = "자료구조"
# day   = "mon"
# start = "09:00"
# end   = "10:50"
#
# [[recording.timetable]]
# name  = "영어2"
# day   = "tue"
# start = "11:00"
# end   = "12:50"
# language = "en"          # 영어 수업 -> 반드시 지정하세요
#
# [[recording.timetable]]
# name  = "기초웹프로그래밍"
# day   = "wed"
# start = "13:00"
# end   = "14:50"
# language = "ko+en"       # 한국어 설명 + 영어 용어가 많이 섞이는 수업


# =====================================================================
#  3. 음성 전사 (STT)
# =====================================================================
[transcribe]
enabled = true

# 엔진
#   "faster-whisper" : 로컬 실행. 무료, 인터넷 불필요.      [권장]
#   "openai"         : OpenAI API. 유료, 음성이 외부로 전송됨.
engine = "faster-whisper"

# 전사 언어.
#
#   "ko"     한국어 고정. 가장 정확합니다.
#   "en"     영어 고정.
#   "ko+en"  둘 중에서 모델이 고르되, 다른 언어로는 가지 않게 막습니다.
#   "auto"   모델에 전적으로 맡깁니다.
#
# !! 영어 수업이 있다면 이 값 하나로 두면 안 됩니다 !!
#   Whisper 는 지정한 언어로 '받아쓰려고' 합니다. 영어 음성을 "ko" 로
#   지정하면 소리 나는 대로 한글을 뱉습니다("디스 이즈 어 바이너리 트리").
#   그 과목 전사본은 통째로 쓸모없어집니다.
#   과목마다 다르게 주려면 아래 [[recording.timetable]] 의 language 를
#   쓰거나, 녹화할 때 --language en 을 붙이세요.
#
# 한국어 강의 중간의 영어 전문용어는 "ko" 로도 잘 처리됩니다.
# "auto" 로 두면 오히려 그 구간에서 일본어·중국어로 오판하는 일이 있습니다.
language = "ko"

# 결과 포맷 (여러 개 선택 가능)
#   txt  : 순수 텍스트
#   srt  : 자막 (타임코드 포함)
#   vtt  : 웹 자막
#   json : 단어 단위 타임스탬프 포함
formats = ["txt", "srt"]

# 어느 트랙을 전사할지: "system" / "mic" / "both"
# 온라인 강의라면 system, 교실 녹음이면 mic 입니다.
source_track = "system"

# ---------------------------------------------------------------------
[transcribe.batch]
# 녹화가 끝난 뒤 돌리는 정밀 전사. 이쪽이 본체입니다.
enabled = true

# 모델 크기: tiny / base / small / medium / large-v3
#   저사양 노트북(GPU 없음) 기준 1시간 음성 처리 시간 대략치
#     tiny   ~2분   |  base  ~4분   |  small ~10분
#     medium ~30분  |  large ~60분+
#   저사양이면 "small" 이 품질/시간 균형점입니다.
model = "small"

# "auto" / "cpu" / "cuda"
device = "auto"

# 연산 정밀도. CPU 에서는 "int8" 이 가장 빠릅니다.
compute_type = "int8"

# 사용할 CPU 스레드 수. 0 = 자동(코어 수 - 1).
# 전부 쓰면 노트북이 멈춘 듯 느려집니다.
cpu_threads = 0

# 전사를 녹화 직후 바로 돌릴지, 아니면 대기열에 쌓아뒀다가
# 나중에 `python -m gymhall transcribe queue` 로 한 번에 돌릴지.
#   "immediate" : 녹화 종료 직후 실행
#   "queue"     : 대기열에만 넣음 (배터리/발열에 유리)  [저사양 권장]
mode = "queue"

# 무음 구간 건너뛰기. 쉬는 시간이 긴 강의에서 시간을 크게 줄입니다.
vad_filter = true

# ---------------------------------------------------------------------
[transcribe.realtime]
# !! 저사양 노트북에서는 켜지 마세요 !!
# 녹화와 동시에 CPU를 쓰기 때문에 프레임 드랍과 음성 끊김이 생깁니다.
# 켜야 한다면 recording.video.fps 를 5 로 낮추고 model 을 tiny 로 두세요.
# 실시간 결과는 어디까지나 '임시본'이며, 종료 후 정밀본이 덮어씁니다.
enabled = false

model        = "tiny"
device       = "cpu"
compute_type = "int8"
cpu_threads  = 2

# 몇 초 단위로 끊어서 전사할지. 짧을수록 반응이 빠르지만 문장이 잘립니다.
chunk_sec   = 8
# 앞 구간과 겹치는 길이(초). 문장 잘림을 완화합니다.
overlap_sec = 1.5

# 실시간 전사 결과를 화면에 띄울지 (콘솔 출력)
print_to_console = true

# ---------------------------------------------------------------------
# [transcribe.cleanup] 지어낸 문장 걸러내기
#
#   Whisper 는 유튜브 자막으로 학습돼서, 무음 구간을 만나면 자막 상투어를
#   지어냅니다. 강의 녹화는 판서 시간, 질문 대기, 쉬는 시간처럼 무음이
#   길어서 이게 특히 잘 생깁니다. 걸러내지 않으면 전사본 곳곳에
#   "시청해주셔서 감사합니다" 가 박힙니다.
# ---------------------------------------------------------------------
[transcribe.cleanup]
enabled = true

# 알려진 상투어 목록과 정확히 일치하면 버립니다.
# 교수가 이 문장을 그대로 말할 확률은 사실상 없지만, 오탐이 걱정되면 끄세요.
drop_hallucinations = true

# 모델이 스스로 매긴 '무음 확률' 이 이 값을 넘으면 텍스트를 믿지 않습니다.
# 낮출수록 공격적으로 지웁니다. 0 이면 이 검사를 끕니다.
no_speech_threshold = 0.85

# Whisper 자체 기본 규칙도 함께 적용합니다:
#   무음 확률 > 0.6  '그리고'  평균 확신도 < -1.0  이면 버립니다.
# 두 신호가 같이 나쁠 때만 적용하므로 위 단독 임계값보다 오탐이 적고,
# 0.6~0.85 구간에서 모델이 확신 없이 지어낸 문장을 잡아냅니다.
use_logprob_rule = true

# 같은 문장이 연속으로 이 횟수를 넘으면 반복 루프로 보고 이후를 버립니다.
# 0 이면 이 검사를 끕니다.
max_repeats = 3

# 직접 추가할 문구. 특정 강의에서만 반복되는 잡음 문구가 있을 때 넣으세요.
#   예: extra_phrases = ["자 그러면", "에 그러니까"]
extra_phrases = []

# ---------------------------------------------------------------------
[transcribe.openai]
# engine = "openai" 일 때만 사용.
# API 키는 여기 적지 말고: python -m gymhall secrets set openai
model = "whisper-1"
# 파일이 25MB를 넘으면 잘라서 보냅니다.
chunk_minutes = 10
