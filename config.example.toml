# =====================================================================
#  GYM-W-HALL-2F  설정 파일
# ---------------------------------------------------------------------
#  이 파일을 config.toml 로 복사한 뒤 값을 고치세요.
#    copy config.example.toml config.toml
#
#  config.toml 은 .gitignore 에 등록되어 있어 커밋되지 않습니다.
#  비밀번호/토큰은 여기 적지 말고 `python -m gymhall secrets set` 으로
#  Windows 자격증명 관리자(DPAPI)에 저장하세요.
# =====================================================================


# ---------------------------------------------------------------------
# [general] 공통 설정
# ---------------------------------------------------------------------
[general]
# 모든 산출물이 저장되는 최상위 폴더.
# 비워두면 %LOCALAPPDATA%\gym-w-hall-2f 를 씁니다.
# 장소를 옮겨 다니며 쓸 때는 OneDrive/드롭박스 폴더를 피하세요(동기화 충돌).
data_dir = ""

# 로그 수준: DEBUG / INFO / WARNING / ERROR
log_level = "INFO"

# 로그 파일 보관 일수
log_retention_days = 30

# 작업 이름. 여러 PC에서 같은 레포로 올릴 때 구분자로 쓰입니다.
# 비워두면 컴퓨터 이름을 씁니다.  예: "노트북", "집데스크탑"
machine_label = ""


# ---------------------------------------------------------------------
# [github] 릴리스 업로드
# ---------------------------------------------------------------------
[github]
enabled = true

# 산출물을 올릴 저장소. 소스코드 저장소와 달라도 됩니다.
owner = "class-from-kunsan"
repo  = "gym-w-hall-2f"

# 릴리스 태그 전략
#   "monthly"  -> recordings-2026-11   (한 달에 릴리스 1개, 에셋 누적)  [권장]
#   "weekly"   -> recordings-2026-W46
#   "daily"    -> recordings-2026-11-11
#   "single"   -> 아래 fixed_tag 하나만 계속 사용
tag_strategy = "monthly"
fixed_tag    = "archive"

# e-class 자료만 따로 정합니다. 기본은 날짜별: eclass-2026-11-13
# (위 tag_strategy 는 녹화에만 적용됩니다.)
tag_strategy_eclass = "daily"

# 태그 앞에 붙는 접두사. 종류별로 릴리스를 나누고 싶을 때 바꾸세요.
tag_prefix_eclass    = "eclass"
tag_prefix_recording = "recordings"

# 릴리스를 draft/prerelease 로 만들지 여부
draft      = false
prerelease = false

# GitHub 릴리스 에셋 1개당 상한은 2GiB 입니다.
# 이보다 큰 파일은 자동으로 .part001 .part002 ... 로 쪼개 올리고
# 복원용 manifest(.parts.json)와 합치기 스크립트를 같이 올립니다.
# 안전 마진을 둬서 기본값은 1900 MiB.
split_size_mb = 1900

# 업로드 재시도
retry_count    = 4
retry_backoff  = 2.0   # 초. 2 -> 4 -> 8 -> 16

# 업로드 성공 후 로컬 원본을 지울지 여부.
# 처음에는 반드시 false 로 두고, 신뢰가 생긴 뒤에 true 로 바꾸세요.
delete_local_after_upload = false
# 레포는 학기마다 새로 만듭니다(repo 이름에 학기를 넣으세요).
#   false = 없는 레포는 만들지 않고 무엇을 해야 하는지만 알려 줍니다(기본)
#   true  = 없으면 만듭니다. 개인 계정은 토큰의 repo 권한, 조직은 그
#           조직의 레포 생성 허용이 필요합니다.
create_missing_repos = false
repo_private = true


# =====================================================================
#  1. ECLASS 수집
# =====================================================================
[eclass]
enabled = true

# 로그인 페이지 주소. probe 로 확인한 실제 주소를 넣으세요.
base_url  = "https://eclass.kunsan.ac.kr"
login_url = "https://eclass.kunsan.ac.kr/"

# 학번(아이디). 비밀번호는 여기 적지 마세요.
#   python -m gymhall secrets set eclass
username = ""

# 브라우저 표시 여부. 처음 설정할 때는 false 로 두고 눈으로 확인하세요.
headless = true

# 페이지 로딩 대기 상한(밀리초). 학교망이 느릴 때 늘리세요.
timeout_ms = 30000

# 요청 간 최소 간격(초). 서버에 부담을 주지 않기 위한 값입니다.
# 0.5 미만으로 내리지 마세요.
request_delay_sec = 1.0

# 수집할 과목.
#   - 비워두면([]) 내 수강 목록 전체를 자동으로 돌립니다.
#   - 특정 과목만 원하면 과목명 일부나 과목코드를 넣으세요.
courses = []

# 제외할 과목 (courses 가 비어 있을 때 적용)
exclude_courses = []
# 읽을 쪽지함. RECEIVE(받은) / SEND(보낸) / WASTEBASKET(휴지통)
message_boxes = ["RECEIVE"]

# 텍스트(.md) 옆에 같은 이름의 화면 스크린샷(.png)을 남깁니다.
#   표 모양, 색으로 강조한 마감일, 본문 그림처럼 글자로 옮기면 사라지는
#   것을 남겨 둡니다. 추출이 무언가를 빠뜨렸을 때 알아챌 수도 있습니다.
#   - 모든 화면 머리의 본인 '학번(이름)님' 은 가려서 찍습니다.
#   - 쪽지는 보낸이를 .md 와 같은 이름표(보낸이-xxxxxx)로 바꾼 뒤 찍고,
#     다 바꾸지 못하면 찍지 않습니다.
#   - 내용이 그대로라 .md 를 다시 쓰지 않는 실행에서는 찍지 않습니다.
#   용량이 늘어납니다(화면 한 장에 수백 KB). 끄려면 false.
screenshots = true

# ---------------------------------------------------------------------
# 과목 = 레포지터리
#   이 PC 가 담당하는 과목과 그 과목이 올라갈 레포를 적습니다.
#   비워 두면 예전처럼 github.owner / github.repo 한 곳으로 전부
#   올라갑니다. 한 줄이라도 적는 순간, 여기 없는 과목은 수집은 하되
#   올리지 않습니다(로컬에만 남습니다).
#
#   두 겹 대괄호 [[...]] 입니다. 한 겹으로 적으면 목록이 아니라
#   표 하나가 되어 설정 검사에서 막힙니다.
#
#   위쪽 eclass.courses 와 헷갈리지 마세요.
#     eclass.courses       = 무엇을 수집할지 (이름 일부로 거르기)
#     eclass.course_repos  = 어디로 올릴지   (과목 -> 레포)
# ---------------------------------------------------------------------
# 비우면 github.owner / github.repo 한 곳으로 전부 올라갑니다.
course_repos = []

# 아래처럼 적으면 과목마다 다른 레포로 갑니다(주석을 푸세요).
# [[eclass.course_repos]]
# id   = "2026211043701"          # eClass 과목 코드(있으면 가장 정확)
# name = "자료구조"                # 폴더명·시간표와 맞추는 이름
# repo = "datastructure-2026-2"   # 이 과목이 올라갈 레포
# # owner = "다른조직"             # 생략하면 github.owner

# [[eclass.course_repos]]
# id   = "2026211043802"
# name = "운영체제"
# repo = "os-2026-2"



# ---------------------------------------------------------------------
# [eclass.menus] 메뉴별 수집 on/off
#   Eclass 과목 좌측 메뉴 기준입니다. 과목마다 있는 메뉴가 다르므로
#   없는 메뉴는 자동으로 건너뜁니다.
# ---------------------------------------------------------------------
[eclass.menus]
# --- 학습 목차 ---
curriculum     = true    # 학습 목차(주차별). 세 주차씩 보여 주는 화면을
                         #   좌우로 끝까지 넘겨 전 주차를 모읍니다.
lecture_list   = true    # 강의 목록 / 교안
# --- 과목 정보 ---
syllabus       = true    # 수업 계획서 (강의계획서)
course_info    = true    # 과목 정보
# --- 학습 정보 ---
notice         = true    # 공지사항  (본문 + 첨부)
qna            = true    # 질의응답
materials      = true    # 강의자료실 / 학습자료실 (첨부파일)
# --- 학습 활동 ---
assignment     = true    # 과제 명세 + 첨부. 제출물은 건드리지 않습니다.
attendance     = false   # 출석. 읽기 전용이지만 민감정보라 기본 off.
team           = false   # 팀활동
# --- 학습 현황 ---
progress       = false   # 학습 현황(진도율). 민감정보라 기본 off.
# --- 쪽지 ---
#   강의자료가 쪽지로도 옵니다. 보낸이 이름/사번은 익명화해 저장하고
#   본문은 그대로 둡니다. 과목이 아니라 계정 단위라 한 번만 돕니다.
message        = true
# --- 성적 ---
grade          = false   # 성적보기. 민감정보라 기본 off.

# ---------------------------------------------------------------------
#  !! 위험 구역 !!
#  시험 / 설문 / 토론은 "열람" 자체가 LMS에 기록으로 남습니다.
#    - 시험 페이지 진입 = 응시 시작으로 기록될 수 있음
#    - 설문 진입 = 참여로 집계될 수 있음
#    - 토론 조회 기록이 참여 점수에 반영되는 과목이 있음
#  자동화된 접근은 부정행위로 오해받을 수 있습니다.
#  아래를 켜더라도 "목록 제목만" 읽고 상세 페이지에는 절대 진입하지
#  않습니다. 그래도 책임은 사용자에게 있습니다.
# ---------------------------------------------------------------------
[eclass.risky]
# 이 값이 true 가 아니면 아래 3개는 무시됩니다.
i_understand_the_risk = false
exam       = false   # 시험
survey     = false   # 설문
discussion = false   # 토론


# ---------------------------------------------------------------------
# [eclass.upload] 무엇을 릴리스에 올릴지
#   수집은 하되 업로드는 안 할 수 있습니다(민감정보).
# ---------------------------------------------------------------------
[eclass.upload]
enabled = true
# 업로드에서 제외할 메뉴 (위 [eclass.menus] 키 이름 사용)
exclude_menus = ["grade", "attendance", "progress"]
# 확장자 화이트리스트. 비우면 전부 허용.
allow_extensions = []
# 이 용량(MB)을 넘는 첨부는 올리지 않고 로컬에만 둡니다. 0 = 제한 없음
max_file_mb = 0


# ---------------------------------------------------------------------
# [eclass.menu_ids]
#   eClass 좌측 메뉴는 내부적으로 menu_00092 같은 고정 ID 를 씁니다.
#   이 값들은 소스코드(src/gymhall/eclass/urls.py)에 이미 들어 있으므로
#   보통은 비워 두면 됩니다.
#
#   학교가 LMS 를 개편해 수집이 안 될 때만 채우세요. 새 ID 는
#     scripts\eclass_probe.bat
#   을 돌리면 나오는 report.json 에서 확인할 수 있습니다.
#
#   예:  assignment = "menu_00063"
# ---------------------------------------------------------------------
[eclass.menu_ids]
# curriculum   = ""
# lecture_list = ""
# attendance   = ""
# assignment   = ""
# team         = ""


# =====================================================================
#  2. 화면 녹화 + 음성 녹음
# =====================================================================
[recording]
enabled = true

# 녹화 파일 컨테이너. mkv 는 녹화 중 전원이 꺼져도 파일이 살아남습니다.
# mp4 는 정상 종료되지 않으면 파일이 깨집니다. mkv 를 권장합니다.
container = "mkv"

# 녹화를 이 길이(분)마다 끊어서 별도 파일로 만듭니다.
#   - 2GiB 릴리스 상한을 자연스럽게 피합니다
#   - 중간에 뻗어도 앞부분은 살아남습니다
#   - 0 = 끊지 않음 (권장하지 않음)
segment_minutes = 30

# 최대 녹화 길이(분). 깜빡 잊고 켜둔 채 퇴근하는 사고 방지.
max_duration_minutes = 240

# 녹화 시작 전/종료 후 여유 시간(분). 시간표 기반 자동 녹화에만 적용.
#
# pre_roll 은 **소리에만** 적용됩니다. 화면 캡처는 당기지 않고 정시에
# 시작합니다. 그 2분 동안 강의실 PC 앞에 앉은 사람(조교, 먼저 온 학생)의
# 화면이 통째로 찍혀 릴리스에 올라가기 때문입니다. 화면은 그 2분을
# 놓쳐도 잃는 것이 거의 없습니다 — 띄워 둔 슬라이드는 정시에도
# 그대로 있습니다. 반면 소리는 수업이 1분 일찍 시작하면 그 말을
# 영영 못 받습니다. 그래서 소리만 당깁니다.
#
# 주의: 소리는 pre_roll 동안 실제로 녹음됩니다. 수업 전 강의실 대화가
# 들어갑니다. 그게 곤란하면 0 으로 두세요 — 대신 수업이 예정보다
# 일찍 시작하면 그 앞부분을 놓칩니다. 어느 쪽을 택할지는 운영자가
# 정할 문제라, 조용히 0 으로 바꾸지 않았습니다.
#
# 수동 녹화(record start)와 watch 에는 적용되지 않습니다. "지금부터"
# 를 누른 것이지 "2분 전부터" 가 아니기 때문입니다.
pre_roll_minutes  = 2
post_roll_minutes = 3

# ---------------------------------------------------------------------
[recording.video]
enabled = true

# 어느 화면을 잡을지.
#   0 = 전체 바탕화면(기본). 모니터가 둘이면 둘을 가로로 이어 붙인
#       그림이 나옵니다 — 빔프로젝터 쪽이 절반 크기로 줄고, 교탁
#       화면에 떠 있는 메일까지 같이 올라갑니다.
#   1,2,... = 그 화면만. 번호는 `python -m gymhall devices` 로 확인.
#
# window_title 을 적어 두면 이 값은 무시됩니다(창 하나가 화면 하나보다
# 좁으니 더 좁은 쪽이 이깁니다).
# 번호가 화면 개수보다 크면 경고를 찍고 전체 바탕화면으로 돌아갑니다 —
# 조용히 1번으로 떨어지면 설정이 틀린 줄 모르고 한 학기를 보냅니다.
monitor = 0

# 캡처 방식 (Windows)
#   "gdigrab"  : 호환성 최고, CPU 사용 보통.            [저사양 권장]
#   "ddagrab"  : Desktop Duplication. 빠르지만 ffmpeg 빌드를 탑니다.
backend = "gdigrab"

# 프레임레이트. 강의 슬라이드는 5~10 이면 충분합니다.
# 저사양 노트북에서 실시간 전사를 함께 켠다면 5 를 쓰세요.
fps = 10

# 해상도 축소. 0 이면 원본 그대로.
# 1920x1080 화면을 1280x720 으로 줄이면 용량과 CPU가 크게 줄어듭니다.
scale_width  = 1280
scale_height = 0        # 0 = 비율 유지

# x264 설정. crf 가 클수록 용량이 작고 화질이 낮습니다.
#   슬라이드 위주 강의: crf 30 전후도 충분히 읽힙니다.
preset = "veryfast"      # ultrafast > superfast > veryfast > faster > fast
crf    = 30

# 특정 창만 녹화하려면 창 제목을 넣으세요. 비우면 전체 화면.
# 예: "Zoom 회의"
window_title = ""

# 마우스 커서 표시
draw_mouse = true

# ---------------------------------------------------------------------
[recording.audio]
enabled = true

# 오디오 캡처 백엔드
#   "soundcard" : WASAPI 루프백을 직접 사용. 드라이버 설치 불필요.  [권장]
#   "dshow"     : ffmpeg DirectShow. VB-Cable 같은 가상 장치를 직접
#                 설치해야 시스템 소리를 잡을 수 있습니다.
backend = "soundcard"

samplerate = 48000
channels   = 2

# --- 트랙 1: 시스템 소리 (스피커로 나가는 소리 = 온라인 강의 소리) ---
system_enabled = true
# 비우면 현재 기본 재생 장치를 자동으로 씁니다.
# 특정 장치를 고르려면 `python -m gymhall devices` 로 이름을 확인하세요.
system_device = ""
system_gain_db = 0.0

# --- 트랙 2: 마이크 ---
mic_enabled = true
mic_device  = ""

# 기본 마이크가 '죽어 있으면' 다른 마이크로 바꿉니다.
#
# 2026-11-13 실기 PC 의 기본 마이크는 '마이크 배열 (Audio Share)' 라는
# 가상 장치였고, 61초 녹음에 0 아닌 바이트가 하나도 없었습니다. 설정을
# 비워 둔 PC 는 OS 기본 장치를 그대로 쓰므로 수업 내내 비트 단위 0 이
# 녹음되고, 끝나고서야 압니다.
#
# 녹화 시작 전에 마이크를 1.5초씩 열어 최대 레벨만 재고 버립니다.
# 정확히 0 이면 죽은 것으로 보고 다음 장치를 봅니다. 첫 성공에서
# 멈추므로 보통 1.5초면 끝납니다. 받은 소리는 파일로 남기지 않습니다.
#
# 좋은 마이크를 고르는 기능이 아닙니다. **죽은 마이크를 거르는 것까지만**
# 합니다 — 잡음 크기로는 어느 쪽이 교수 목소리를 잘 잡을지 알 수 없습니다.
#
# mic_device 에 이름을 적었으면 이 값은 무시됩니다. 사람이 고른 것을
# 코드가 뒤집지 않습니다.
# 시스템 소리(루프백)에는 적용되지 않습니다 — 재생 중인 게 없으면
# 정확히 0 이 정상이라 전부 오탐이 됩니다.
mic_auto_select = true
mic_probe_sec   = 1.5
mic_gain_db = 0.0

# 두 트랙을 최종 파일에 어떻게 넣을지
#   "separate" : 별도 트랙 2개로 저장. 나중에 분리 가능.     [권장]
#   "mixed"    : 하나로 합침. 파일이 작지만 분리 불가.
#   "both"     : 별도 트랙 2개 + 합친 트랙 1개 (총 3트랙).
track_layout = "separate"

# 무음 감지. 이 시간(초) 이상 양쪽 다 무음이면 경고 로그를 남깁니다.
# (장치를 잘못 골랐을 때 3시간 뒤에야 알게 되는 사고 방지)
silence_warn_sec = 60
# 켜져 있는 트랙이 **전부 동시에** 무음일 때만 장치 문제로 봅니다.
# (마이크만 조용한 것은 흔합니다 — 판서, 시험 시간)
#   silence_stop_sec  : 여기까지 가면 녹화를 멈춥니다
#   silence_abort_sec : 여기까지 가면 세션을 '깨짐' 으로 보고 업로드도 안 합니다
# 둘 다 예약(record schedule)·감지(record watch) 녹화에만 적용됩니다.
# 수동(record start)은 경고만 합니다.
silence_stop_sec  = 900
silence_abort_sec = 3600
# '완전 무음' 기준. 낮출수록 엄격합니다.
silence_peak = 1e-5

# ---------------------------------------------------------------------
# [recording.triggers] 언제 녹화를 시작할지
# ---------------------------------------------------------------------
[recording.triggers]
# (A) 수동 실행 — 바탕화면 바로가기 / 터미널
manual = true

# (B) 시간표 기반 자동
schedule_enabled = false

# (C) 특정 프로그램/창이 뜨면 자동 시작
watch_enabled = false
# 감지할 프로세스 이름 (확장자 포함, 대소문자 무시)
watch_processes = ["Zoom.exe", "Webex.exe", "Teams.exe"]
# 감지할 창 제목 부분 문자열
watch_window_titles = []
# 감지 주기(초)
watch_interval_sec = 15
# 대상이 사라지고 이 시간(초)이 지나면 녹화를 종료합니다.
watch_stop_grace_sec = 60

# ---------------------------------------------------------------------
# [recording.terminal] 터미널 녹음기 — FFmpeg / SoX / arecord
#
#   python -m gymhall audio record            지금 바로 (아래 값대로)
#   python -m gymhall audio record --vad      소리가 날 때만 (SoX)
#   python -m gymhall audio tools             설치된 도구와 실행될 명령 보기
#
# 화면 없이 **소리만** 받습니다. macOS·Linux 에서도 돌고, cron 이나
# 작업 스케줄러에 그대로 걸 수 있습니다. 자세한 내용은
# docs/TERMINAL_AUDIO.md 에 있습니다.
#
#   도구     지원 OS                 핵심 기능                     쓸 만한 때
#   ffmpeg  Windows/macOS/Linux     -t 로 정확한 길이, mp3 인코딩   예약 시간제 녹음
#   sox     Windows/macOS/Linux     silence 로 소리 감지 녹음       소리 날 때만 기록
#   arecord Linux                   설치 불필요, 초경량             서버·라즈베리파이
# ---------------------------------------------------------------------
[recording.terminal]
# "auto" 면 ffmpeg -> sox -> arecord(리눅스) 순으로 있는 것을 씁니다.
# vad = true 면 auto 는 sox 로 갑니다(소리 감지는 SoX 만 됩니다).
backend = "auto"

# "mic"    : 마이크(기본 입력 장치)
# "system" : 스피커로 나가는 소리.
#            Linux 는 @DEFAULT_MONITOR@ 로 바로 됩니다.
#            macOS 는 BlackHole 같은 가상 장치를 깔고 device 에 적어야 합니다.
#            Windows 는 여기서 안 됩니다 — `record start`(WASAPI 루프백)를 쓰세요.
source = "mic"

# 비우면 기본 장치. 형식은 도구마다 다릅니다.
#   ffmpeg Windows : dshow 이름  (ffmpeg -list_devices true -f dshow -i dummy)
#   ffmpeg macOS   : avfoundation 번호, 예 "0"  (ffmpeg -f avfoundation -list_devices true -i "")
#   ffmpeg Linux   : pulse 소스 이름  (pactl list short sources)
#   arecord        : ALSA 장치, 예 "plughw:1,0"  (arecord -L)
device = ""

# 녹음 길이(초). ffmpeg 의 -t, arecord 의 -d, sox 의 trim 으로 들어갑니다.
# vad = true 일 때는 '최대' 길이입니다.
seconds = 3600

# "wav" / "mp3" / "flac". mp3 는 ffmpeg 만 됩니다. arecord 는 wav 만 됩니다.
format = "wav"

# 파일 이름. strftime 형식이라 날짜·시각별로 쌓이고 덮어쓰지 않습니다.
# 셸의 record_$(date +%Y%m%d_%H%M%S).mp3 와 같습니다.
filename = "record_%Y%m%d_%H%M%S"

# 비우면 <데이터 폴더>/recordings/<날짜>/terminal
out_dir = ""

samplerate = 44100
channels   = 2

# 소리 감지 녹음 (SoX 의 silence 효과)
#   rec out.wav silence 1 0.1 3% 1 3.0 3%
#   = 3% 이상 소리가 0.1초 이어지면 시작, 3% 아래로 3초 이어지면 끝
vad           = false
vad_threshold = "3%"
vad_start_sec = 0.1
vad_stop_sec  = 3.0

# ---------------------------------------------------------------------
# [[recording.timetable]] 시간표
#   schedule_enabled = true 일 때만 사용됩니다.
#   day: mon tue wed thu fri sat sun
#   시간은 24시간제 HH:MM, 로컬 시간 기준입니다.
#
#   아래는 예시입니다. 실제 시간표로 바꾸고 필요 없는 줄은 지우세요.
# ---------------------------------------------------------------------
#   language: 이 수업만 다른 언어로 전사합니다(선택).
#             생략하면 위 [transcribe] 의 language 를 씁니다.
#
# [[recording.timetable]]
# name  = "자료구조"
# day   = "mon"
# start = "09:00"
# end   = "10:50"
#
# [[recording.timetable]]
# name  = "영어2"
# day   = "tue"
# start = "11:00"
# end   = "12:50"
# language = "en"          # 영어 수업 -> 반드시 지정하세요
#
# [[recording.timetable]]
# name  = "기초웹프로그래밍"
# day   = "wed"
# start = "13:00"
# end   = "14:50"
# language = "ko+en"       # 한국어 설명 + 영어 용어가 많이 섞이는 수업


# =====================================================================
#  2-1. 실시간 오디오 송출 (Tailscale 망 안에서만)
#
#   python -m gymhall stream start          지금 송출 (링크 -> GitHub 이슈)
#   python -m gymhall stream schedule       시간표대로 수업마다 송출
#   python -m gymhall stream link           링크가 어떻게 만들어질지 미리 보기
#   python -m gymhall stream cleanup        비정상 종료로 남은 tailscale serve 정리
#
# 소리를 mp3/aac 로 인코딩해 내장 서버(또는 Icecast)로 내보내고,
# Tailscale 로 같은 tailnet 의 기기만 들을 수 있게 합니다. 링크가 생길
# 때마다(시작할 때, 기기 주소가 바뀔 때) 저장소 이슈로 올립니다.
# 자세한 내용: docs/STREAMING.md
#
# 주의: 강의 소리는 교수와 학교의 저작물입니다. tailnet 밖(funnel)으로
#       내보내거나 public 저장소에 링크를 올리면 공중송신이 됩니다.
# =====================================================================
[stream]
# "builtin" : 내장 HTTP 오디오 서버. 설치할 것이 없습니다.          [권장]
# "icecast" : Icecast(오픈소스 스트리밍 서버)로 밉니다. Icecast 를 따로
#             띄워 두고  python -m gymhall secrets set icecast  로 소스
#             비밀번호를 저장하세요. 접속 토큰은 쓰지 않습니다.
server = "builtin"

# "system" : 스피커로 나가는 소리(온라인 강의 소리)   "mic" : 마이크
source = "system"
# "auto"      : soundcard 가 있으면 soundcard, 없으면 ffmpeg
# "soundcard" : WASAPI 루프백 포함. Windows 에서 system 은 이것만 됩니다
# "ffmpeg"    : ffmpeg 가 장치를 직접 엶 (dshow / avfoundation / pulse)
capture = "auto"
# 비우면 기본 장치. 이름 일부(soundcard) 또는 ffmpeg 장치 이름/번호.
device = ""

# "mp3" 또는 "aac". 둘 다 중간에 들어온 청취자도 바로 재생됩니다.
codec        = "mp3"
bitrate_kbps = 96        # 말소리는 64 로도 충분합니다
samplerate   = 48000
channels     = 2

# 내장 서버 포트와 경로. 듣기 주소는 <호스트><path>, 재생 페이지는 <호스트>/
port = 8765
# 비우면 자동: direct 모드는 이 기기의 Tailscale IP, serve/funnel 은 127.0.0.1.
# "0.0.0.0" 으로 두면 같은 와이파이의 다른 사람도 닿을 수 있습니다.
bind = ""
path = "/live"
player_page = true
title = "실시간 송출"

# 동시 청취자 상한 (0 = 무제한)
max_listeners = 0
# 이만큼 밀린 청취자 한 명만 끊습니다(송출은 계속, 그 청취자는 다시 접속하면 됨).
client_buffer_kb = 2048

# 접속 토큰. 링크 끝에 ?t=... 로 붙습니다. tailnet 안이라도 링크를
# 모르는 사람은 못 듣게 합니다.
require_token = true
# 비우면 송출마다 새로 만듭니다(권장). 고정하려면 12자 이상.
token = ""
token_bytes = 16

# --- 시간표가 최우선 ---
# [[recording.timetable]] 의 수업 시간 안이면 그 수업이 끝나는 시각에 끝나고,
# 그 전에는 아래 어떤 조건(최대 송출 시간, 청취자 없음, 장애)으로도 멈추지
# 않습니다. 수업 밖에서 켠 송출이 수업 시간에 들어가면 그 수업을 넘겨받습니다.
# `python -m gymhall stream schedule` 은 시간표대로 기다렸다가 수업마다 송출합니다.
follow_timetable = true
# 송출할 수업 이름만 고르기 (비우면 시간표 전체). 예: ["자료구조", "운영체제"]
timetable_slots = []
pre_roll_minutes  = 0        # 수업 시작 몇 분 전부터
post_roll_minutes = 0        # 수업 끝나고 몇 분 더

# --- 멈춤 조건: 기본은 전부 '없음' ---
# 최대 송출 시간(분). 0 = 없음. 닿으면 on_max_duration 대로:
#   "rollback" : 멈추지 않고 인코더를 마지막으로 잘 돌던 상태로 새로 띄워
#                이어 갑니다(장시간 송출의 누적 문제 해소). 링크·이슈는 그대로.   [기본]
#   "stop"     : 멈춤 (시간표 수업 중에는 무시)
max_duration_minutes = 0
on_max_duration = "rollback"
# 청취자가 이만큼(분) 없으면 멈춤. 0 = 없음. 시간표 수업 중에는 무시.
idle_stop_minutes = 0
# 시작 후 이 시간(초) 동안 소리가 실제로 나와야 링크를 올립니다.
# 장치가 틀려 바로 죽는 송출의 링크가 이슈로 올라가는 것을 막습니다.
min_uptime_sec = 5

# --- 롤백(복구) ---
# 인코더가 죽거나 장치가 사라지면 멈추지 않고 되돌립니다:
#   마지막으로 소리가 나온 장치 -> 설정한 device -> (fallback_default_device) 기본 장치
# 실패하면 restart_backoff_sec 부터 두 배씩, restart_backoff_max_sec 까지 늘려 가며 재시도.
# restart_on_failure : 연속 실패 허용 횟수. 0 = 무제한
restart_on_failure      = 0
restart_backoff_sec     = 5
restart_backoff_max_sec = 120
fallback_default_device = true

[stream.tailscale]
# false 면 Tailscale 없이 127.0.0.1 에서만 열고, 이슈도 올리지 않습니다.
enabled = true
# "serve"  : tailnet 안에 HTTPS 로 (tailscale serve)                  [권장]
# "direct" : 이 기기의 Tailscale IP 에 HTTP 로 직접. 방화벽 허용이 필요할 수 있음
# "funnel" : 인터넷 전체 공개 (tailscale funnel). allow_funnel = true 필요
mode = "serve"
https_port = 443           # serve/funnel 의 HTTPS 포트 (funnel 은 443, 8443, 10000 만 됩니다)
use_magicdns = true        # 링크에 기기 이름(…ts.net)을 씀. false 면 100.x IP
allow_funnel = false
exe = ""                   # tailscale 실행 파일 경로 (비우면 자동)
# 이 간격(초)마다 tailnet 상태를 다시 읽어 링크가 바뀌면 다시 올립니다 (0 = 안 봄)
link_check_sec = 60
# Tailscale 이 연결돼 있지 않으면 시작하지 않습니다
require_online = true
# 이 HTTPS 포트를 이미 다른 serve 가 쓰고 있으면 덮어쓸지
override_existing = false
# 끝날 때 serve/funnel 을 끌지
teardown = true

[stream.icecast]
# server = "icecast" 일 때만. 링크의 포트·경로도 이 값을 씁니다.
host  = "127.0.0.1"
port  = 8000
mount = "/live"
user  = "source"

[stream.issue]
# 링크가 생길 때마다 저장소 이슈로 올립니다.
enabled = true
# 비우면 [github] 의 owner / repo
owner = ""
repo  = ""
# 쓸 수 있는 자리: {link} {player} {host} {tailnet} {mode} {label} {machine}
#                  {source} {codec} {bitrate} {started} {until} {reason} {token_note}
title = "[실시간 송출] {label} — {started}"
# 비우면 기본 본문(표 형식). 직접 쓰려면 여러 줄 문자열 """ ... """ 로.
body  = ""
labels      = ["live-stream"]
label_color = "d93f0b"     # 라벨이 없으면 이 색으로 만듭니다
assignees   = []           # 예: ["seongbin45"]
# 본문 맨 앞에 붙일 멘션. 적은 사람에게 GitHub 알림이 갑니다.
mentions    = []           # 예: ["@seongbin45"]
# 링크의 토큰을 이슈에 그대로 적을지. false 면 토큰을 가리고 따로 전해야 합니다.
include_token = true
# 링크가 바뀌었을 때(기기 이름·IP 변경)
#   "new"     : 새 이슈           "comment" : 같은 이슈에 댓글      "none" : 아무것도 안 함
on_change = "new"
close_previous  = true     # "new" 일 때 옛 이슈를 닫음
comment_on_stop = true     # 끝나면 길이·청취 수를 댓글로
close_on_stop   = true     # 끝나면 이슈를 닫음
# 같은 링크(토큰 고정 시)로 열린 이슈가 있으면 새로 만들지 않음
dedupe = true
# public 저장소에는 올리지 않습니다
require_private_repo = true
# 롤백으로 복구할 때마다 이슈에 댓글 (끝날 때 댓글에는 횟수가 항상 들어갑니다)
comment_on_rollback = false


# =====================================================================
#  2-2. 활동 기록 — PDF 폼 "필드 값"(키 입력 아님)
#
#   python -m gymhall activity gate      이 기기가 봉인 저장을 허용받는지 점검
#
# 녹음/녹화와 같은 타임라인에, PDF 폼에 입력한 값을 전사처럼 봉인 저장합니다.
# 키 입력을 가로채지 않습니다 — 어댑터가 커밋된 "필드 값"만 읽습니다.
# **전용 기기에서만**, 자격증명 필드는 스펙 플래그로 제외, 하드웨어/OS 게이트를
# 통과해야만 저장. 기본 전부 꺼짐. 자세한 내용: docs/ACTIVITY.md
#
# 책임 고지: 이 기능은 당신 전용 기기에서만 쓰세요. 기기를 공유하면 타인의
# 입력까지 담길 수 있습니다. public 저장소에 올리지 마세요.
# =====================================================================
[activity]
enabled = false
# 전용 기기(당신만 그 키보드를 만짐)여야 내용 캡처가 돕니다. false 면 어댑터 비활성.
machine_is_private = false
# 수집 창을 [[recording.timetable]] 수업 시간에 묶음
follow_timetable = true
timetable_slots = []
# 필드 값을 언제 읽나(키 후킹 아님): field_commit(blur/change/Enter) | document_save | field_debounce
keys_level = "field_commit"
debounce_ms = 800
# 웹 어댑터 허용 오리진. Adobe 기본 포함, PDF.js 데모(mozilla.github.io)는 제외.
# 당신 뷰어 오리진은 여기 한 줄 추가. `activity origins allow` 로도 됩니다(다음 증분).
origins = ["https://acrobat.adobe.com", "https://documentcloud.adobe.com"]
# 데스크톱 어댑터 프로세스 스코프
process_allowlist = ["Acrobat.exe"]
upload = "sealed_only"     # off | sealed_only
pause_hotkey = "Ctrl+Alt+P"

# 안 쓰는 어댑터는 기능이 아니라 공격면이라 기본 꺼짐. 쓰는 것만 켜세요.
[activity.adapters]
pdfjs = false          # 브라우저 PDF.js (Firefox 내장 등). 오리진 스코프
acrobat_web = false    # acrobat.adobe.com 등. 오리진 스코프
acrobat_js = false     # 데스크톱 Acrobat, 저장 시 필드 값 덤프. 전용 기기만
acrobat_uia = false    # 데스크톱 Acrobat, UIA. 최후 폴백. 전용 기기만

# 정책 엔진 — 자격증명/민감 필드 제외 + 저장 전 레드액션
[activity.policy]
drop_password = true       # /Ff bit13 · type=password · IsPassword. 끌 수 없음
exclude_signature = true   # /FT /Sig
exclude_richtext = false
name_blacklist = ["*ssn*", "*card*", "*cvv*", "*주민*", "*계좌*", "*password*", "*secret*"]
redact_patterns = true     # 저장 전 카드·주민번호 가림(완벽 아님)

# 하드웨어/OS 게이트 — 하나라도 실패하면 저장 거부(fail-closed)
[activity.gate]
require_tpm2 = true
require_secure_boot = true
require_vbs_hvci = true
require_not_elevated = true
require_no_debugger = true
require_attestation = false   # EK/quote. 켜면 미구현이라 fail-closed
# true(기본): 게이트 실패 시 복호도 막음(대칭). false: 읽기는 경고 후 허용
read_enforces_gate = true

# 저장·봉인
[activity.store]
db_path = ""               # 비우면 <데이터>/activity/activity.db
dek_path = ""              # 비우면 <데이터>/activity/dek.bin (DPAPI 봉인)
public_key = ""            # 봉인할 공개키. 비면 저장 안 됨
key_storage = "tpm"        # 추출 불가. TPM 없으면 저장 안 됨
require_hello = true
recovery_key = false       # 복구 불가 수용(기기 죽으면 영구 복구 불가)
retention_days = 0

# C(데스크톱 Acrobat) 사이드카 워처 — acrobat_js 어댑터가 떨군 필드 값을 읽어 봉인.
# 사이드카는 짧은 순간 평문입니다(워처가 읽고 즉시 삭제). 자세한 한계는 docs/ACTIVITY.md.
[activity.watch_acrobat]
staging_dir = ""           # 비우면 <데이터>/activity/.staging
poll_sec = 1.0
sweep_minutes = 5          # 기동 시 이보다 묵은 사이드카는 삭제(평문 잔존 방지)


# =====================================================================
#  3. 음성 전사 (STT)
# =====================================================================
[transcribe]
enabled = true

# 엔진
#   "faster-whisper" : 로컬 실행. 무료, 인터넷 불필요.      [권장]
#   "openai"         : OpenAI API. 유료, 음성이 외부로 전송됨.
engine = "faster-whisper"

# 전사 언어.
#
#   "ko"     한국어 고정. 가장 정확합니다.
#   "en"     영어 고정.
#   "ko+en"  둘 중에서 모델이 고르되, 다른 언어로는 가지 않게 막습니다.
#   "auto"   모델에 전적으로 맡깁니다.
#
# !! 영어 수업이 있다면 이 값 하나로 두면 안 됩니다 !!
#   Whisper 는 지정한 언어로 '받아쓰려고' 합니다. 영어 음성을 "ko" 로
#   지정하면 소리 나는 대로 한글을 뱉습니다("디스 이즈 어 바이너리 트리").
#   그 과목 전사본은 통째로 쓸모없어집니다.
#   과목마다 다르게 주려면 아래 [[recording.timetable]] 의 language 를
#   쓰거나, 녹화할 때 --language en 을 붙이세요.
#
# 한국어 강의 중간의 영어 전문용어는 "ko" 로도 잘 처리됩니다.
# "auto" 로 두면 오히려 그 구간에서 일본어·중국어로 오판하는 일이 있습니다.
language = "ko"

# 결과 포맷 (여러 개 선택 가능)
#   txt  : 순수 텍스트
#   srt  : 자막 (타임코드 포함)
#   vtt  : 웹 자막
#   json : 단어 단위 타임스탬프 포함
formats = ["txt", "srt"]

# 어느 트랙을 전사할지: "system" / "mic" / "both"
# 온라인 강의라면 system, 교실 녹음이면 mic 입니다.
source_track = "system"

# ---------------------------------------------------------------------
[transcribe.batch]
# 녹화가 끝난 뒤 돌리는 정밀 전사. 이쪽이 본체입니다.
enabled = true

# 모델 크기: tiny / base / small / medium / large-v3
#   저사양 노트북(GPU 없음) 기준 1시간 음성 처리 시간 대략치
#     tiny   ~2분   |  base  ~4분   |  small ~10분
#     medium ~30분  |  large ~60분+
#   저사양이면 "small" 이 품질/시간 균형점입니다.
model = "small"

# "auto" / "cpu" / "cuda"
device = "auto"

# 연산 정밀도. CPU 에서는 "int8" 이 가장 빠릅니다.
compute_type = "int8"

# 사용할 CPU 스레드 수. 0 = 자동(코어 수 - 1).
# 전부 쓰면 노트북이 멈춘 듯 느려집니다.
cpu_threads = 0

# 전사를 녹화 직후 바로 돌릴지, 아니면 대기열에 쌓아뒀다가
# 나중에 `python -m gymhall transcribe queue` 로 한 번에 돌릴지.
#   "immediate" : 녹화 종료 직후 실행
#   "queue"     : 대기열에만 넣음 (배터리/발열에 유리)  [저사양 권장]
mode = "queue"

# 무음 구간 건너뛰기. 쉬는 시간이 긴 강의에서 시간을 크게 줄입니다.
vad_filter = true

# ---------------------------------------------------------------------
[transcribe.realtime]
# !! 저사양 노트북에서는 켜지 마세요 !!
# 녹화와 동시에 CPU를 쓰기 때문에 프레임 드랍과 음성 끊김이 생깁니다.
# 켜야 한다면 recording.video.fps 를 5 로 낮추고 model 을 tiny 로 두세요.
# 실시간 결과는 어디까지나 '임시본'이며, 종료 후 정밀본이 덮어씁니다.
enabled = false

model        = "tiny"
device       = "cpu"
compute_type = "int8"
cpu_threads  = 2

# 몇 초 단위로 끊어서 전사할지. 짧을수록 반응이 빠르지만 문장이 잘립니다.
chunk_sec   = 8
# 앞 구간과 겹치는 길이(초). 문장 잘림을 완화합니다.
overlap_sec = 1.5

# 실시간 전사 결과를 화면에 띄울지 (콘솔 출력)
print_to_console = true

# ---------------------------------------------------------------------
# [transcribe.cleanup] 지어낸 문장 걸러내기
#
#   Whisper 는 유튜브 자막으로 학습돼서, 무음 구간을 만나면 자막 상투어를
#   지어냅니다. 강의 녹화는 판서 시간, 질문 대기, 쉬는 시간처럼 무음이
#   길어서 이게 특히 잘 생깁니다. 걸러내지 않으면 전사본 곳곳에
#   "시청해주셔서 감사합니다" 가 박힙니다.
# ---------------------------------------------------------------------
[transcribe.cleanup]
enabled = true

# 알려진 상투어 목록과 정확히 일치하면 버립니다.
# 교수가 이 문장을 그대로 말할 확률은 사실상 없지만, 오탐이 걱정되면 끄세요.
drop_hallucinations = true

# 모델이 스스로 매긴 '무음 확률' 이 이 값을 넘으면 텍스트를 믿지 않습니다.
# 낮출수록 공격적으로 지웁니다. 0 이면 이 검사를 끕니다.
no_speech_threshold = 0.85

# Whisper 자체 기본 규칙도 함께 적용합니다:
#   무음 확률 > 0.6  '그리고'  평균 확신도 < -1.0  이면 버립니다.
# 두 신호가 같이 나쁠 때만 적용하므로 위 단독 임계값보다 오탐이 적고,
# 0.6~0.85 구간에서 모델이 확신 없이 지어낸 문장을 잡아냅니다.
use_logprob_rule = true

# 같은 문장이 연속으로 이 횟수를 넘으면 반복 루프로 보고 이후를 버립니다.
# 0 이면 이 검사를 끕니다.
max_repeats = 3

# 직접 추가할 문구. 특정 강의에서만 반복되는 잡음 문구가 있을 때 넣으세요.
#   예: extra_phrases = ["자 그러면", "에 그러니까"]
extra_phrases = []

# ---------------------------------------------------------------------
[transcribe.openai]
# engine = "openai" 일 때만 사용.
# API 키는 여기 적지 말고: python -m gymhall secrets set openai
model = "whisper-1"
# 파일이 25MB를 넘으면 잘라서 보냅니다.
chunk_minutes = 10


# ---------------------------------------------------------------------
[backup.home]
# 강의실 PC 의 홈 디렉터리(%USERPROFILE%)를 매일 GitHub 릴리스에 올립니다.
#   python -m gymhall backup home      (예약 작업: HomeBackup)
# 릴리스 이름은 home-2026-11-13 처럼 날짜별이라 e-class/녹화와 섞이지 않습니다.
#
# 제외되는 것:
#   - 홈 바로 아래의 AppData 와 '.' 으로 시작하는 폴더(.vscode 등)
#   - 정션/바로가기 폴더('Application Data' 등)와 OneDrive 의 클라우드 전용 파일
#   - 아래 exclude_names 에 맞는 이름(레지스트리, 키, 인증서 등)
# 하위 폴더 안의 .git, node_modules 등은 올라갑니다.
enabled = false

# 비우면 %USERPROFILE%
root = ""
tag_prefix = "home"

# 묶음(zip) 하나에 넣을 원본 크기 합계(MB). 1900 이하.
bundle_mb = 1800

# 올리지 않을 파일 이름(대소문자 무시, * ? 사용 가능)
exclude_names = [
    "ntuser.*",
    "usrclass.dat*",
    "PaceKeyChain",
    ".env",
    ".env.*",
    "*.pem",
    "*.key",
    "*.pfx",
    "*.p12",
    "id_rsa*",
    "id_ecdsa*",
    "id_ed25519*",
    "id_dsa*",
    "*.kdbx",
    "config.toml",
]

[backup.home.prune]
# 올라간 파일을 로컬에서 지웁니다(디렉터리는 남김).  예약 작업: HomePrune
# 로컬 기록이 아니라 GitHub 에 올라간 해시 사슬을 내려받아 확인하고,
# 지우기 직전에 파일 해시가 사슬의 값과 같을 때만 지웁니다.
# 지운 목록: %LOCALAPPDATA%\gym-w-hall-2f\logs\home-prune.log
enabled = false

# 올린 지 이 시간이 지난 것만 지웁니다.
min_age_hours = 24
