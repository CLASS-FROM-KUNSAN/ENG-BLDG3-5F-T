name: tests

# 왜 여러 파이썬 버전에서 돌리는가:
#   threading.Thread 는 3.12 까지 내부 메서드 `_stop()` 을 가지고 있었고
#   3.13 에서 없어졌습니다. 그래서 Thread 하위 클래스에서 `_stop` 이라는
#   이름을 쓰면 3.11/3.12 에서만 join() 이 터집니다. 개발자가 3.13 을
#   쓰고 있으면 멀쩡해 보이고 사용자 PC 에서만 녹화가 깨집니다.
#   실제로 이 저장소에서 그 버그가 났습니다. 3.10~3.13 전부 돌립니다.

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: ffmpeg 설치 (mux 통합 테스트용)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: 테스트 의존성 설치
        # 전체 requirements.txt 를 깔지 않습니다. playwright 브라우저와
        # faster-whisper 모델은 수백 MB 이고, 테스트는 둘 없이 돌아갑니다.
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy requests
          python -m pip install 'tomli; python_version < "3.11"'

      - name: 테스트
        # 바이트코드를 남기지 않습니다. mtime 이 초 단위라, 편집이 같은
        # 초에 몰리면 묵은 .pyc 가 그대로 쓰여 테스트가 거짓으로
        # 통과합니다(2026-11-12 에 실제로 당했습니다).
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q

      - name: 설정 예시 파일 검증
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, "src")
          from pathlib import Path
          from syncnote import config
          text = Path("config.example.toml").read_text(encoding="utf-8")
          text = text.replace('username = ""', 'username = "TEST"', 1)
          Path("ci.toml").write_text(text, encoding="utf-8")
          cfg = config.load("ci.toml")
          print("config.example.toml 검증 통과")
          for note in config.warnings_for(cfg):
              print("  경고:", note)
          PY

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - name: ruff
        run: ruff check src tests

  windows-scripts:
    # .bat / .vbs / .ps1 은 Windows 에서만 문법을 확인할 수 있습니다.
    # 실제 녹화는 오디오 장치가 필요해 CI 에서 돌리지 않습니다.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PowerShell 스크립트 문법 검사
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/register_tasks.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Host "register_tasks.ps1 문법 OK"

      - name: PowerShell 스크립트 문법 검사 (Windows PowerShell 5.1)
        # 강의실 PC 의 'powershell -File' 은 5.1 입니다. 5.1 은 BOM 없는 파일을
        # cp949 로 읽어서, pwsh(7) 에서 멀쩡한 한글 문자열이 깨집니다.
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/register_tasks.ps1"), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Host "register_tasks.ps1 (5.1) OK"

      - name: VBScript 문법 검사
        shell: cmd
        # 인자 없이 실행하면 MsgBox 가 떠서 멈추므로, 구문 분석만 합니다.
        run: |
          cscript //NoLogo //E:vbscript scripts\hidden.vbs dummy.bat
          if errorlevel 2 (echo VBScript 문법 오류 & exit /b 1)
          echo hidden.vbs 문법 OK

      - name: CRLF 줄바꿈 확인
        shell: pwsh
        # .bat 파일이 LF 로 커밋되면 Windows 에서 명령이 깨집니다.
        run: |
          $bad = @()
          Get-ChildItem scripts -Include *.bat,*.vbs,*.ps1 -Recurse | ForEach-Object {
            $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
            $lf = 0; $crlf = 0
            for ($i = 0; $i -lt $bytes.Length; $i++) {
              if ($bytes[$i] -eq 10) {
                if ($i -gt 0 -and $bytes[$i-1] -eq 13) { $crlf++ } else { $lf++ }
              }
            }
            if ($lf -gt 0) { $bad += "$($_.Name): LF $lf / CRLF $crlf" }
          }
          if ($bad) { $bad | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Host "모든 스크립트가 CRLF 입니다"

      - name: CLI 가 Windows 에서 뜨는지
        shell: cmd
        run: |
          # psutil 을 일부러 넣지 않습니다. 없을 때 쓰는 윈도우 ctypes
          # 폴백(recorder/lock.py)이 실제로 도는지 여기서 확인됩니다.
          # requirements.txt 에는 psutil 이 있으니 실사용에서는 그쪽을 씁니다.
          python -m pip install --quiet pytest numpy requests || exit /b 1
          set PYTHONPATH=src
          REM 바이트코드를 남기지 않습니다. mtime 이 초 단위라, 편집이
          REM 같은 초에 몰리면 묵은 .pyc 가 그대로 쓰입니다. 그러면
          REM 테스트가(변이 테스트까지) 거짓으로 통과합니다.
          set PYTHONDONTWRITEBYTECODE=1
          REM cmd 는 중간 명령이 실패해도 다음 줄로 넘어가 이 단계가 통과해 버립니다.
          REM (--help 가 cp1252 콘솔에서 UnicodeEncodeError 로 죽어도 녹색이었음)
          python -m syncnote --help || exit /b 1
          python -m pytest -q
